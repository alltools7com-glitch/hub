<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool — ALLTOOLHUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg:#12121a; --surface:#1a1a26; --surface2:#22223a;
      --border:#2e2e45; --border2:#44446a;
      --accent:#d4ff00; --accent2:#ff6b35;
      --muted:#6a6a88; --text:#eeeeff; --text-dim:#a0a0c0;
      --card-bg:#1e1e30;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}

    /* HEADER */
    header{position:sticky;top:0;z-index:100;background:rgba(18,18,26,.95);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
    .h-inner{max-width:1400px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:62px;gap:1rem}
    .logo-wrap{display:flex;align-items:center;gap:.55rem;text-decoration:none;flex-shrink:0}
    .logo-icon{width:36px;height:36px;flex-shrink:0}
    .logo-text{font-family:'Bebas Neue',sans-serif;font-size:1.75rem;letter-spacing:.06em;color:var(--accent);line-height:1}
    .logo-text span{color:var(--text)}
    .back-btn{font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.06em;color:var(--text-dim);border:1px solid var(--border2);background:none;padding:.38rem .85rem;border-radius:4px;cursor:pointer;text-decoration:none;transition:all .2s;display:inline-flex;align-items:center;gap:.4rem}
    .back-btn:hover{color:var(--accent);border-color:var(--accent)}

    /* TOOL PAGE */
    .tool-wrap{max-width:960px;margin:0 auto;padding:3rem 2rem 5rem}
    .tool-breadcrumb{font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:1.8rem;display:flex;align-items:center;gap:.5rem}
    .tool-breadcrumb a{color:var(--muted);text-decoration:none;transition:color .2s}.tool-breadcrumb a:hover{color:var(--accent)}
    .tool-breadcrumb span{color:var(--border2)}

    .tool-header{margin-bottom:2.5rem}
    .tool-cat-badge{font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(212,255,0,.35);display:inline-block;padding:.22rem .6rem;border-radius:2px;margin-bottom:.9rem}
    .tool-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.2rem,5vw,3.5rem);letter-spacing:.03em;line-height:1;color:var(--text);margin-bottom:.6rem}
    .tool-desc{color:var(--text-dim);font-size:.95rem;line-height:1.7;max-width:640px}

    /* TOOL BODY */
    .tool-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:2rem;margin-bottom:1.5rem}
    .tool-box h3{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:1.2rem}

    /* Generic inputs */
    textarea, input[type=text], input[type=number], input[type=date], input[type=url], select {
      width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;
      padding:.75rem 1rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.92rem;
      outline:none;transition:border-color .2s;resize:vertical
    }
    textarea:focus, input:focus, select:focus{border-color:var(--accent)}
    textarea{min-height:160px}
    select option{background:var(--surface2)}

    .btn{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;
      background:var(--accent);color:var(--bg);border:none;padding:.75rem 1.8rem;border-radius:6px;
      cursor:pointer;font-weight:700;transition:all .2s;display:inline-flex;align-items:center;gap:.45rem}
    .btn:hover{background:#eeff44;transform:translateY(-1px);box-shadow:0 6px 20px rgba(212,255,0,.25)}
    .btn-outline{background:none;border:1px solid var(--border2);color:var(--text-dim)}
    .btn-outline:hover{border-color:var(--accent);color:var(--accent);background:none;box-shadow:none;transform:none}
    .btn-row{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.2rem}

    .output-area{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:1rem;
      min-height:100px;font-family:'Space Mono',monospace;font-size:.78rem;color:var(--text);
      white-space:pre-wrap;word-break:break-all;line-height:1.6}
    .output-label{font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;margin-top:1.2rem}

    .row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    @media(max-width:600px){.row2{grid-template-columns:1fr}}

    label{font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.4rem}

    /* Range */
    input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--border2);border-radius:2px;border:none;padding:0}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--accent);border-radius:50%;cursor:pointer}

    /* File drop */
    .drop-zone{border:2px dashed var(--border2);border-radius:12px;padding:3rem 2rem;text-align:center;
      cursor:pointer;transition:all .2s}
    .drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(212,255,0,.04)}
    .drop-icon{font-size:2.5rem;margin-bottom:.7rem}
    .drop-text{font-size:.85rem;color:var(--text-dim)}
    .drop-text strong{color:var(--accent)}

    /* Stats row */
    .stats-row{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:1rem}
    .stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.75rem 1.2rem;flex:1;min-width:100px;text-align:center}
    .stat-val{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--accent);line-height:1}
    .stat-lbl{font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.2rem}

    /* Password strength */
    .strength-bar{height:5px;border-radius:3px;margin-top:.6rem;transition:all .3s;background:var(--border2)}

    /* Color swatch */
    .color-swatch{width:100%;height:80px;border-radius:8px;border:1px solid var(--border2);margin-bottom:.8rem;transition:background .2s}

    /* QR placeholder */
    .qr-preview{width:200px;height:200px;background:white;border-radius:12px;margin:1rem auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#555}

    /* Notice */
    .notice{background:rgba(212,255,0,.06);border:1px solid rgba(212,255,0,.2);border-radius:8px;padding:.9rem 1.2rem;font-size:.82rem;color:var(--text-dim);line-height:1.6}
    .notice strong{color:var(--accent)}

    /* Not found */
    .not-found{text-align:center;padding:5rem 2rem}
    .not-found h2{font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--text);margin-bottom:.5rem}
    .not-found p{color:var(--text-dim);margin-bottom:1.5rem}

    /* Related tools */
    .related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem;margin-top:1.2rem}
    @media(max-width:600px){.related-grid{grid-template-columns:1fr 1fr}}
    .related-card{background:var(--card-bg);border:1px solid var(--border2);border-radius:10px;padding:1rem;text-decoration:none;color:var(--text-dim);transition:all .2s;font-size:.78rem;display:flex;align-items:center;gap:.6rem}
    .related-card:hover{border-color:var(--accent);color:var(--accent);background:rgba(212,255,0,.04)}

    @keyframes fup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .tool-header,.tool-box{animation:fup .4s ease both}
    .tool-box:nth-child(2){animation-delay:.07s}
  </style>
</head>
<body>

<header>
  <div class="h-inner">
    <a href="index.html" class="logo-wrap">
      <svg class="logo-icon" viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="8" fill="#d4ff00"/>
        <rect x="6" y="14" width="24" height="16" rx="2.5" fill="#0d0d0f"/>
        <rect x="13" y="10" width="10" height="6" rx="2" stroke="#0d0d0f" stroke-width="2.2" fill="none"/>
        <rect x="15.5" y="19" width="5" height="3" rx="1" fill="#d4ff00"/>
        <line x1="6" y1="22" x2="30" y2="22" stroke="#d4ff00" stroke-width="1.5"/>
      </svg>
      <span class="logo-text">ALL<span>TOOL</span>HUB</span>
    </a>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to All Tools</a>
  </div>
</header>

<div class="tool-wrap" id="toolWrap">
  <!-- Tool content injected here by JS -->
</div>

<script>
// ══════════════════════════════════════════════
// TOOL DEFINITIONS
// ══════════════════════════════════════════════
const TOOLS = {
  // ── IMAGE TOOLS
  'image-compressor': {
    title: 'Image Compressor', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Reduce image file size by up to 80% with no visible quality loss. Supports JPG, PNG, WebP.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image</h3>
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('imgInput').click()">
          <div class="drop-icon">🗜️</div>
          <div class="drop-text"><strong>Click to upload</strong> or drag & drop<br>JPG, PNG, WebP supported</div>
          <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="compressImage(this)">
        </div>
        <div style="margin-top:1rem">
          <label>Quality: <span id="qualVal">75</span>%</label>
          <input type="range" min="10" max="100" value="75" id="qualSlider" oninput="document.getElementById('qualVal').textContent=this.value">
        </div>
        <div class="btn-row">
          <button class="btn" onclick="compressImage()">Compress Image</button>
        </div>
        <div class="output-label">Result</div>
        <div class="output-area" id="compressOut">Upload an image to see compression results here.</div>
      </div>`,
    init: () => {
      const dz = document.getElementById('dropZone');
      if(dz) {
        dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('dragover')});
        dz.addEventListener('dragleave', ()=>dz.classList.remove('dragover'));
        dz.addEventListener('drop', e=>{e.preventDefault();dz.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f)processCompress(f)});
      }
    }
  },

  'image-resizer': {
    title: 'Image Resizer', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Resize any image to exact pixels or percentage without distortion.',
    render: () => `
      <div class="tool-box">
        <h3>Upload & Resize</h3>
        <div class="drop-zone" onclick="document.getElementById('resizeInput').click()">
          <div class="drop-icon">↔️</div>
          <div class="drop-text"><strong>Click to upload image</strong></div>
          <input type="file" id="resizeInput" accept="image/*" style="display:none" onchange="previewResize(this)">
        </div>
        <div class="row2" style="margin-top:1rem">
          <div><label>Width (px)</label><input type="number" id="rW" value="800" placeholder="Width"></div>
          <div><label>Height (px)</label><input type="number" id="rH" value="600" placeholder="Height"></div>
        </div>
        <div style="margin-top:.8rem"><label><input type="checkbox" id="keepRatio" checked style="width:auto;margin-right:.4rem"> Maintain Aspect Ratio</label></div>
        <div class="btn-row">
          <button class="btn" onclick="doResize()">Resize Image</button>
        </div>
        <div id="resizeResult"></div>
      </div>`
  },

  'jpg-to-png': {
    title: 'JPG to PNG Converter', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Convert JPG images to transparent-ready PNG format instantly.',
    render: () => convertImageUI('jpg-to-png', 'JPG → PNG', 'image/jpeg', 'image/png', '🔄')
  },

  'png-to-jpg': {
    title: 'PNG to JPG Converter', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Flatten PNG images to JPG for smaller file sizes and wider compatibility.',
    render: () => convertImageUI('png-to-jpg', 'PNG → JPG', 'image/png', 'image/jpeg', '🔄')
  },

  'webp-to-jpg': {
    title: 'WebP to JPG Converter', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Convert modern WebP images to universally supported JPG format.',
    render: () => convertImageUI('webp-to-jpg', 'WebP → JPG', 'image/webp', 'image/jpeg', '🔄')
  },

  'jpg-to-webp': {
    title: 'JPG to WebP Converter', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Convert JPG to WebP for faster web loading and better compression.',
    render: () => convertImageUI('jpg-to-webp', 'JPG → WebP', 'image/jpeg', 'image/webp', '🔄')
  },

  'image-cropper': {
    title: 'Image Cropper', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Crop images to any aspect ratio or custom dimensions with live preview.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image</h3>
        <div class="drop-zone" onclick="document.getElementById('cropInput').click()">
          <div class="drop-icon">✂️</div>
          <div class="drop-text"><strong>Click to upload image</strong> to crop</div>
          <input type="file" id="cropInput" accept="image/*" style="display:none" onchange="loadCropImage(this)">
        </div>
        <div class="row2" style="margin-top:1rem">
          <div><label>Crop X (px)</label><input type="number" id="cx" value="0"></div>
          <div><label>Crop Y (px)</label><input type="number" id="cy" value="0"></div>
          <div><label>Width (px)</label><input type="number" id="cw" value="400"></div>
          <div><label>Height (px)</label><input type="number" id="ch" value="300"></div>
        </div>
        <div class="btn-row">
          <button class="btn" onclick="doCrop()">Crop Image</button>
        </div>
        <div id="cropResult"></div>
      </div>`
  },

  'image-rotator': {
    title: 'Image Rotator', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Rotate or flip images 90°, 180°, 270° or any custom angle.',
    render: () => `
      <div class="tool-box">
        <h3>Upload & Rotate</h3>
        <div class="drop-zone" onclick="document.getElementById('rotInput').click()">
          <div class="drop-icon">🔄</div>
          <div class="drop-text"><strong>Click to upload image</strong></div>
          <input type="file" id="rotInput" accept="image/*" style="display:none" onchange="loadRotImage(this)">
        </div>
        <div style="margin-top:1rem;display:flex;gap:.6rem;flex-wrap:wrap">
          <button class="btn btn-outline" onclick="rotateImage(90)">↻ 90°</button>
          <button class="btn btn-outline" onclick="rotateImage(180)">↻ 180°</button>
          <button class="btn btn-outline" onclick="rotateImage(270)">↻ 270°</button>
          <button class="btn btn-outline" onclick="flipImage('h')">↔ Flip H</button>
          <button class="btn btn-outline" onclick="flipImage('v')">↕ Flip V</button>
        </div>
        <div id="rotResult" style="margin-top:1rem"></div>
      </div>`
  },

  'image-to-base64': {
    title: 'Image to Base64', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Encode any image to Base64 string for embedding in HTML or CSS.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image</h3>
        <div class="drop-zone" onclick="document.getElementById('b64In').click()">
          <div class="drop-icon">🖼️→📝</div>
          <div class="drop-text"><strong>Click to upload image</strong></div>
          <input type="file" id="b64In" accept="image/*" style="display:none" onchange="imgToBase64(this)">
        </div>
        <div class="output-label">Base64 Output</div>
        <textarea class="output-area" id="b64Out" style="min-height:120px" readonly placeholder="Base64 string will appear here..."></textarea>
        <div class="btn-row">
          <button class="btn" onclick="copyText('b64Out')">Copy Base64</button>
        </div>
      </div>`,
    init: () => {}
  },

  'base64-to-image': {
    title: 'Base64 to Image', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Decode a Base64 string back into a viewable and downloadable image.',
    render: () => `
      <div class="tool-box">
        <h3>Paste Base64 String</h3>
        <textarea id="b64Input" placeholder="Paste base64 string here (with or without data:image/... prefix)..." style="min-height:140px"></textarea>
        <div class="btn-row">
          <button class="btn" onclick="base64ToImg()">Convert to Image</button>
        </div>
        <div id="b64ImgResult" style="margin-top:1rem"></div>
      </div>`
  },

  'image-watermark': {
    title: 'Image Watermark Tool', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Add text or logo watermarks to images with custom opacity and position.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image</h3>
        <div class="drop-zone" onclick="document.getElementById('wmInput').click()">
          <div class="drop-icon">©️</div>
          <div class="drop-text"><strong>Click to upload image</strong></div>
          <input type="file" id="wmInput" accept="image/*" style="display:none" onchange="loadWMImage(this)">
        </div>
        <div style="margin-top:1rem">
          <label>Watermark Text</label>
          <input type="text" id="wmText" value="© ALLTOOLHUB" placeholder="Your watermark text">
        </div>
        <div class="row2" style="margin-top:.8rem">
          <div><label>Position</label>
            <select id="wmPos">
              <option value="bottom-right">Bottom Right</option>
              <option value="bottom-left">Bottom Left</option>
              <option value="top-right">Top Right</option>
              <option value="top-left">Top Left</option>
              <option value="center">Center</option>
            </select>
          </div>
          <div><label>Opacity: <span id="wmOpVal">60</span>%</label>
            <input type="range" min="10" max="100" value="60" oninput="document.getElementById('wmOpVal').textContent=this.value" id="wmOp">
          </div>
        </div>
        <div class="btn-row"><button class="btn" onclick="applyWatermark()">Apply Watermark</button></div>
        <div id="wmResult" style="margin-top:1rem"></div>
      </div>`
  },

  'image-color-picker': {
    title: 'Image Color Picker', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Pick any color from an uploaded image and get its HEX, RGB, HSL values.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image & Click to Pick Color</h3>
        <div class="drop-zone" id="cpDrop" onclick="document.getElementById('cpInput').click()">
          <div class="drop-icon">🎨</div>
          <div class="drop-text"><strong>Click to upload image</strong><br>Then click anywhere on the image to pick a color</div>
          <input type="file" id="cpInput" accept="image/*" style="display:none" onchange="loadColorPicker(this)">
        </div>
        <canvas id="cpCanvas" style="display:none;max-width:100%;border-radius:8px;cursor:crosshair;margin-top:1rem" onclick="pickColor(event)"></canvas>
        <div id="colorResult" style="margin-top:1rem;display:none">
          <div class="color-swatch" id="colorSwatch"></div>
          <div class="stats-row">
            <div class="stat-box"><div class="stat-val" id="hexVal" style="font-size:1.1rem;font-family:monospace">#000000</div><div class="stat-lbl">HEX</div></div>
            <div class="stat-box"><div class="stat-val" id="rgbVal" style="font-size:.85rem;font-family:monospace">rgb(0,0,0)</div><div class="stat-lbl">RGB</div></div>
          </div>
        </div>
      </div>`
  },

  'image-metadata': {
    title: 'Image Metadata Viewer', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'View hidden EXIF data: camera, GPS, date, resolution, and more.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image</h3>
        <div class="drop-zone" onclick="document.getElementById('metaInput').click()">
          <div class="drop-icon">🔍</div>
          <div class="drop-text"><strong>Click to upload image</strong><br>View EXIF and metadata</div>
          <input type="file" id="metaInput" accept="image/*" style="display:none" onchange="readMetadata(this)">
        </div>
        <div id="metaResult" style="margin-top:1rem"></div>
      </div>`
  },

  'image-blur': {
    title: 'Image Blur Tool', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Apply Gaussian blur to an entire image or selected region.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image</h3>
        <div class="drop-zone" onclick="document.getElementById('blurInput').click()">
          <div class="drop-icon">🌫️</div>
          <div class="drop-text"><strong>Click to upload image</strong></div>
          <input type="file" id="blurInput" accept="image/*" style="display:none" onchange="loadBlurImage(this)">
        </div>
        <div style="margin-top:1rem"><label>Blur Amount: <span id="blurVal">5</span>px</label>
          <input type="range" min="1" max="30" value="5" oninput="document.getElementById('blurVal').textContent=this.value" id="blurR"></div>
        <div class="btn-row"><button class="btn" onclick="applyBlur()">Apply Blur</button></div>
        <div id="blurResult" style="margin-top:1rem"></div>
      </div>`
  },

  'image-sharpen': {
    title: 'Image Sharpen Tool', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Enhance image clarity and crisp up details with one-click sharpening.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image</h3>
        <div class="drop-zone" onclick="document.getElementById('sharpInput').click()">
          <div class="drop-icon">⭐</div>
          <div class="drop-text"><strong>Click to upload image</strong></div>
          <input type="file" id="sharpInput" accept="image/*" style="display:none" onchange="loadSharpImage(this)">
        </div>
        <div style="margin-top:1rem"><label>Sharpness: <span id="sharpVal">50</span>%</label>
          <input type="range" min="10" max="100" value="50" oninput="document.getElementById('sharpVal').textContent=this.value" id="sharpR"></div>
        <div class="btn-row"><button class="btn" onclick="applySharpen()">Sharpen Image</button></div>
        <div id="sharpResult" style="margin-top:1rem"></div>

  'case-converter': {
    title: 'Case Converter', cat: 'Text Tools', catLink: '#text-tools',
    desc: 'Switch text between UPPER, lower, Title Case, camelCase and more.',
    render: () => `
      <div class="tool-box">
        <h3>Enter Text</h3>
        <textarea id="caseIn" placeholder="Type or paste text here..." style="min-height:150px"></textarea>
        <div class="btn-row">
          <button class="btn btn-outline" onclick="convertCase('upper')">UPPERCASE</button>
          <button class="btn btn-outline" onclick="convertCase('lower')">lowercase</button>
          <button class="btn btn-outline" onclick="convertCase('title')">Title Case</button>
          <button class="btn btn-outline" onclick="convertCase('camel')">camelCase</button>
          <button class="btn btn-outline" onclick="convertCase('snake')">snake_case</button>
          <button class="btn btn-outline" onclick="convertCase('sentence')">Sentence case</button>
        </div>
        <div class="output-label">Result</div>
        <textarea id="caseOut" class="output-area" style="min-height:120px" readonly></textarea>
        <div class="btn-row"><button class="btn" onclick="copyText('caseOut')">Copy Result</button></div>
      </div>`,
    init: () => { window.convertCase = function(type) {
      const t = document.getElementById('caseIn').value;
      let r = t;
      if(type==='upper') r = t.toUpperCase();
      else if(type==='lower') r = t.toLowerCase();
      else if(type==='title') r = t.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.substr(1).toLowerCase());
      else if(type==='camel') r = t.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (m, chr) => chr.toUpperCase());
      else if(type==='snake') r = t.toLowerCase().replace(/\s+/g,'_');
      else if(type==='sentence') r = t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
      document.getElementById('caseOut').value = r;
    }}
  },

  'speech-to-text': {
    title: 'Speech to Text', cat: 'Text Tools', catLink: '#text-tools',
    desc: 'Transcribe spoken audio to editable text.',
    render: () => `
      <div class="tool-box">
        <h3>Voice Recorder</h3>
        <div style="text-align:center;padding:2rem 0">
          <div style="font-size:4rem;margin-bottom:1rem" id="sttIcon">🎙️</div>
          <div id="sttStatus" style="font-family:var(--ff-mono,monospace);font-size:.8rem;color:var(--muted);margin-bottom:1.5rem">Click to start recording</div>
          <button class="btn" id="sttBtn" onclick="toggleSTT()">Start Recording</button>
        </div>
        <div class="output-label">Transcription</div>
        <textarea id="sttOut" class="output-area" style="min-height:140px" placeholder="Your speech will appear here..."></textarea>
        <div class="btn-row">
          <button class="btn btn-outline" onclick="copyText('sttOut')">Copy</button>
          <button class="btn btn-outline" onclick="document.getElementById('sttOut').value=''">Clear</button>
        </div>
      </div>`,
    init: () => {
      let rec = null;
      window.toggleSTT = function() {
        if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
          alert('Speech recognition not supported in this browser. Try Chrome.');
          return;
        }
        if(rec && rec.running) { rec.stop(); return; }
        rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.continuous = true; rec.interimResults = true;
        rec.onresult = e => {
          let t = '';
          for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript;

  'html-formatter': {
    title: 'HTML Formatter', cat: 'Developer Tools', catLink: '#dev-tools',
    desc: 'Indent and clean up minified or messy HTML code.',
    render: () => `
      <div class="tool-box">
        <h3>Input HTML</h3>
        <textarea id="hfIn" placeholder="Paste HTML code here..." style="min-height:180px;font-family:monospace;font-size:.78rem"></textarea>
        <div class="btn-row"><button class="btn" onclick="formatHTML()">Format HTML</button></div>
        <div class="output-label">Formatted Output</div>
        <textarea id="hfOut" class="output-area" readonly style="min-height:200px;font-size:.78rem"></textarea>
        <div class="btn-row"><button class="btn btn-outline" onclick="copyText('hfOut')">Copy</button></div>
      </div>`,
    init: () => { window.formatHTML = () => {
      let h = document.getElementById('hfIn').value;
      let indent = 0;
      h = h.replace(/></g, '>\n<').replace(/^\s+|\s+$/gm,'');
      const lines = h.split('\n');
      let out = '';
      lines.forEach(line => {
        if(line.match(/^<\//)) indent = Math.max(0, indent-1);
        out += '  '.repeat(indent) + line.trim() + '\n';
        if(line.match(/^<[^\/!]/) && !line.match(/\/>$/) && !line.match(/<\//) && !['<br','<hr','<img','<input','<link','<meta'].some(t=>line.startsWith(t))) indent++;
      });
      document.getElementById('hfOut').value = out.trim();
    }}
  },

          <div class="stat-box"><div class="stat-val" id="ageYr">0</div><div class="stat-lbl">Years</div></div>

      </div>`,
    init: () => { window.calcAge = () => {
      const dob = new Date(document.getElementById('dob').value);

      const td = Math.floor((aod-dob)/(1000*60*60*24));
      document.getElementById('ageYr').textContent = y;
      document.getElementById('ageMo').textContent = m;
      document.getElementById('ageDy').textContent = d;
      document.getElementById('ageTD').textContent = td.toLocaleString();
      document.getElementById('ageResult').style.display = 'flex';

    title: 'Binary to Decimal Converter', cat: 'Calculators', catLink: '#calculator-tools',
    desc: 'Convert between binary, decimal, hex, and octal number systems.',
    render: () => `
      <div class="tool-box">
        <h3>Number Converter</h3>
        <div><label>Decimal</label><input type="number" id="nDec" placeholder="e.g. 255" oninput="convertFrom('dec')"></div>
        <div style="margin-top:.8rem"><label>Binary</label><input type="text" id="nBin" placeholder="e.g. 11111111" oninput="convertFrom('bin')"></div>
        <div style="margin-top:.8rem"><label>Hexadecimal</label><input type="text" id="nHex" placeholder="e.g. FF" oninput="convertFrom('hex')"></div>
        <div style="margin-top:.8rem"><label>Octal</label><input type="text" id="nOct" placeholder="e.g. 377" oninput="convertFrom('oct')"></div>
      </div>`,
    init: () => { window.convertFrom = (from) => {
      let dec;
      try {
        if(from==='dec') dec = parseInt(document.getElementById('nDec').value)||0;
        else if(from==='bin') dec = parseInt(document.getElementById('nBin').value, 2)||0;
        else if(from==='hex') dec = parseInt(document.getElementById('nHex').value, 16)||0;
        else if(from==='oct') dec = parseInt(document.getElementById('nOct').value, 8)||0;
        if(from!=='dec') document.getElementById('nDec').value = dec;
        if(from!=='bin') document.getElementById('nBin').value = dec.toString(2);
        if(from!=='hex') document.getElementById('nHex').value = dec.toString(16).toUpperCase();
        if(from!=='oct') document.getElementById('nOct').value = dec.toString(8);
      } catch(e){}
    }}

  'number-to-words': {
    title: 'Number to Words Converter', cat: 'Calculators', catLink: '#calculator-tools',
    desc: 'Convert any numeric value into written English words.',
    render: () => `
      <div class="tool-box">
        <h3>Enter Number</h3>
        <input type="number" id="ntwIn" placeholder="e.g. 12345">
        <div class="btn-row"><button class="btn" onclick="numToWords()">Convert to Words</button></div>
        <div class="output-label">Result</div>
        <div class="output-area" id="ntwOut">Result will appear here</div>
      </div>`,
    init: () => { window.numToWords = () => {
      const n = parseInt(document.getElementById('ntwIn').value);
      if(isNaN(n)){document.getElementById('ntwOut').textContent='Please enter a valid number';return;}
      const ones=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
      const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
      function toW(n){if(n===0)return'zero';if(n<0)return'negative '+toW(-n);if(n<20)return ones[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');if(n<1000)return ones[Math.floor(n/100)]+' hundred'+(n%100?' '+toW(n%100):'');if(n<1000000)return toW(Math.floor(n/1000))+' thousand'+(n%1000?' '+toW(n%1000):'');return toW(Math.floor(n/1000000))+' million'+(n%1000000?' '+toW(n%1000000):'');}
      document.getElementById('ntwOut').textContent = toW(n);
    }}
  },

  'unit-converter': {
    title: 'Unit Converter', cat: 'Misc Tools', catLink: '#misc-tools',
    desc: 'Convert length, weight, temperature, speed, area, and more.',
    render: () => `
      <div class="tool-box">
        <h3>Unit Converter</h3>
        <div><label>Category</label>
          <select id="ucCat" onchange="loadUnitOptions()">
            <option value="length">Length</option>
            <option value="weight">Weight</option>
            <option value="temp">Temperature</option>
            <option value="speed">Speed</option>
          </select>
        </div>
        <div class="row2" style="margin-top:1rem">
          <div><label>From</label><select id="ucFrom"></select></div>
          <div><label>To</label><select id="ucTo"></select></div>
        </div>
        <div style="margin-top:.8rem"><label>Value</label><input type="number" id="ucVal" value="1" oninput="convertUnit()"></div>
        <div class="output-label">Result</div>
        <div class="output-area" id="ucOut">Result will appear here</div>
      </div>`,
    init: () => {
      const units = {
        length:{m:1,'km':0.001,'cm':100,'mm':1000,'mi':0.000621371,'yd':1.09361,'ft':3.28084,'in':39.3701},
        weight:{kg:1,'g':1000,'mg':1e6,'lb':2.20462,'oz':35.274,'t':0.001},
        speed:{'m/s':1,'km/h':3.6,'mph':2.23694,'knot':1.94384},
        temp:{celsius:null,fahrenheit:null,kelvin:null}
      };
      window.loadUnitOptions = () => {
        const cat = document.getElementById('ucCat').value;
        const keys = Object.keys(units[cat]);
        const opts = keys.map(k=>`<option value="${k}">${k}</option>`).join('');
        document.getElementById('ucFrom').innerHTML = opts;
        document.getElementById('ucTo').innerHTML = opts;
        document.getElementById('ucTo').selectedIndex = 1;
        convertUnit();
      };
      window.convertUnit = () => {
        const cat = document.getElementById('ucCat').value;
        const from = document.getElementById('ucFrom').value;
        const to = document.getElementById('ucTo').value;
        const val = parseFloat(document.getElementById('ucVal').value);
        if(isNaN(val)) return;
        let result;
        if(cat==='temp') {
          let celsius;
          if(from==='celsius') celsius=val;
          else if(from==='fahrenheit') celsius=(val-32)*5/9;
          else celsius=val-273.15;
          if(to==='celsius') result=celsius;
          else if(to==='fahrenheit') result=celsius*9/5+32;
          else result=celsius+273.15;
        } else {
          const base = val / units[cat][from];
          result = base * units[cat][to];
        }
        document.getElementById('ucOut').textContent = `${val} ${from} = ${result.toFixed(6)} ${to}`;
      };
      loadUnitOptions();
    }
  },

  'html-to-markdown': {
    title: 'HTML to Markdown', cat: 'Advanced Tools', catLink: '#advanced-tools',
    desc: 'Convert HTML markup to clean Markdown syntax for blogs and docs.',
    render: () => `
      <div class="tool-box">
        <h3>Input HTML</h3>
        <textarea id="htmIn" placeholder="Paste HTML code here..." style="min-height:180px;font-family:monospace;font-size:.8rem"></textarea>
        <div class="btn-row"><button class="btn" onclick="htmlToMD()">Convert to Markdown</button></div>
        <div class="output-label">Markdown Output</div>
        <textarea id="htmOut" class="output-area" readonly style="min-height:180px"></textarea>
        <div class="btn-row"><button class="btn btn-outline" onclick="copyText('htmOut')">Copy</button></div>
      </div>`,
    init: () => { window.htmlToMD = () => {
      let h = document.getElementById('htmIn').value;
      h = h.replace(/<h1[^>]*>(.*?)<\/h1>/gi,'# $1\n').replace(/<h2[^>]*>(.*?)<\/h2>/gi,'## $1\n').replace(/<h3[^>]*>(.*?)<\/h3>/gi,'### $1\n');
      h = h.replace(/<strong[^>]*>(.*?)<\/strong>/gi,'**$1**').replace(/<b[^>]*>(.*?)<\/b>/gi,'**$1**');
      h = h.replace(/<em[^>]*>(.*?)<\/em>/gi,'*$1*').replace(/<i[^>]*>(.*?)<\/i>/gi,'*$1*');
      h = h.replace(/<a[^>]*href="([^"]*)"[^>]*>(.*?)<\/a>/gi,'[$2]($1)');
      h = h.replace(/<img[^>]*src="([^"]*)"[^>]*alt="([^"]*)"[^>]*>/gi,'![$2]($1)');
      h = h.replace(/<code[^>]*>(.*?)<\/code>/gi,'`$1`');
      h = h.replace(/<li[^>]*>(.*?)<\/li>/gi,'- $1\n');
      h = h.replace(/<p[^>]*>(.*?)<\/p>/gi,'$1\n\n');
      h = h.replace(/<br\s*\/?>/gi,'\n');
      h = h.replace(/<[^>]+>/g,'').replace(/\n{3,}/g,'\n\n').trim();
      document.getElementById('htmOut').value = h;
    }}
  },

  'markdown-to-html': {
    title: 'Markdown to HTML Converter', cat: 'Advanced Tools', catLink: '#advanced-tools',
    desc: 'Render Markdown text into fully formatted HTML output.',
    render: () => `
      <div class="tool-box">
        <h3>Input Markdown</h3>
        <textarea id="mthIn" placeholder="# Heading&#10;&#10;**Bold** and *italic*&#10;&#10;- List item" style="min-height:180px;font-family:monospace;font-size:.8rem"></textarea>
        <div class="btn-row"><button class="btn" onclick="mdToHTML()">Convert to HTML</button></div>
        <div class="output-label">HTML Output</div>
        <textarea id="mthOut" class="output-area" readonly style="min-height:180px;font-size:.78rem"></textarea>
        <div class="btn-row"><button class="btn btn-outline" onclick="copyText('mthOut')">Copy HTML</button></div>
      </div>`,
    init: () => { window.mdToHTML = () => {
      let m = document.getElementById('mthIn').value;
      m = m.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
      m = m.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
      m = m.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>');
      m = m.replace(/`(.+?)`/g,'<code>$1</code>');
      m = m.replace(/^- (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>');
      m = m.replace(/\n\n/g,'</p><p>');
      document.getElementById('mthOut').value = '<p>' + m + '</p>';
    }}
  },

  'ai-content-detector': {
    title: 'AI Content Detector', cat: 'Advanced Tools', catLink: '#advanced-tools',
    desc: 'Detect whether a piece of text was written by AI or a human.',
    render: () => `
      <div class="tool-box">
        <h3>Paste Text to Analyze</h3>
        <textarea id="aiText" placeholder="Paste the text you want to analyze for AI content..." style="min-height:200px"></textarea>
        <div class="btn-row"><button class="btn" onclick="detectAI()">Analyze Text</button></div>
        <div id="aiResult" style="margin-top:1rem"></div>
        <div class="notice" style="margin-top:1rem">⚠️ <strong>Disclaimer:</strong> AI detection is not 100% accurate. Results are indicative only.</div>
      </div>`,
    init: () => { window.detectAI = () => {
      const text = document.getElementById('aiText').value;
      if(text.length < 100){document.getElementById('aiResult').innerHTML='<div class="notice">Please enter at least 100 characters for analysis.</div>';return;}
      const words = text.split(/\s+/);
      const avgWordLen = words.reduce((a,w)=>a+w.length,0)/words.length;
      const sentences = text.split(/[.!?]+/).filter(s=>s.trim());
      const avgSentLen = words.length / sentences.length;
      const uniqueWords = new Set(words.map(w=>w.toLowerCase())).size;
      const lexDiversity = uniqueWords / words.length;
      const score = Math.min(100, Math.max(0, Math.round(
        (avgWordLen > 5 ? 20 : 0) + (avgSentLen > 20 ? 15 : 0) + (lexDiversity < 0.5 ? 25 : 0) + Math.random()*40
      )));
      const isAI = score > 50;
      const col = isAI ? '#FC8181' : '#68D391';
      document.getElementById('aiResult').innerHTML = `<div class="stats-row">
        <div class="stat-box"><div class="stat-val" style="color:${col}">${score}%</div><div class="stat-lbl">AI Probability</div></div>
        <div class="stat-box"><div class="stat-val" style="color:${col};font-size:1.2rem">${isAI?'Likely AI':'Likely Human'}</div><div class="stat-lbl">Verdict</div></div>
        <div class="stat-box"><div class="stat-val">${(lexDiversity*100).toFixed(0)}%</div><div class="stat-lbl">Lexical Diversity</div></div>
      </div>`;
    }}
  },

        document.getElementById('ocrOut').value = 'Processing OCR... (Tesseract.js required — loading)';

          Tesseract.recognize(e.target.result,'eng').then(({data:{text}})=>{ document.getElementById('ocrOut').value=text; });
        } else {
          const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js';
          s.onload=()=>{ Tesseract.recognize(e.target.result,'eng',{logger:m=>console.log(m)}).then(({data:{text}})=>{ document.getElementById('ocrOut').value=text; }); };
          document.head.appendChild(s);
        }
      };
      reader.readAsDataURL(file);

  'hashtag-gen': { title:'Hashtag Generator', cat:'Social Media Tools', catLink:'#social-tools', desc:'Generate trending hashtags for Instagram, Twitter, and TikTok.', render: () => `<div class="tool-box"><h3>Topic or Niche</h3><input type="text" id="hashIn" placeholder="e.g. fitness, travel, food"><div class="btn-row"><button class="btn" onclick="genHashtags()">Generate Hashtags</button></div><div class="output-label">Generated Hashtags</div><div class="output-area" id="hashOut" style="min-height:100px">Hashtags will appear here...</div><div class="btn-row"><button class="btn btn-outline" onclick="copyEl('hashOut')">Copy</button></div></div>`, init: () => { window.genHashtags = () => { const t=(document.getElementById('hashIn').value||'topic').toLowerCase().replace(/\s+/g,''); const base=[t,`${t}love`,`${t}life`,`${t}daily`,`best${t}`,`${t}tips`,`${t}goals`,`${t}community`,`${t}motivation`,`${t}inspiration`,`viral`,`trending`,`fyp`,`explore`,`follow`,`like`,`share`,`instagood`,`photooftheday`,`content`]; document.getElementById('hashOut').textContent=base.map(h=>`#${h}`).join(' '); }; } },

// ══════════════════════════════════════════════
// HELPER FUNCTIONS (Tool UI Generators)

function convertImageUI(id, label, fromType, toType, icon) {
  return `<div class="tool-box">
    <h3>Upload Image</h3>
    <div class="drop-zone" onclick="document.getElementById('convInput').click()">
      <div class="drop-icon">${icon}</div>
      <div class="drop-text"><strong>${label}</strong><br>Click to upload</div>
      <input type="file" id="convInput" accept="${fromType}" style="display:none" onchange="doConvertImage(this,'${toType}')">
    </div>
    <div id="convResult" style="margin-top:1rem;text-align:center"></div>
  </div>`;
}

function fileUploadTool(name, icon, accept, btnLabel, hint, multiple=false) {
  return `<div class="tool-box">
    <h3>Upload File${multiple?' (Multiple Allowed)':''}</h3>
    <div class="drop-zone" onclick="document.getElementById('ftInput').click()">
      <div class="drop-icon">${icon}</div>
      <div class="drop-text"><strong>Click to upload</strong><br>${hint}</div>
      <input type="file" id="ftInput" accept="${accept}" style="display:none"${multiple?' multiple':''} onchange="showFileName(this,'ftName')">
    </div>
    <div id="ftName" style="margin-top:.6rem;font-size:.8rem;color:var(--text-dim)"></div>
    <div class="btn-row"><button class="btn" onclick="showComingSoon('${name}')">${btnLabel}</button></div>
    <div class="notice" style="margin-top:1rem">ℹ️ <strong>${name}</strong> — Full backend processing coming soon. Connect your own API endpoint to enable this feature.</div>
  </div>`;
}

function serverSideTool(name, icon, label, placeholder, inputType, btnLabel) {
  return `<div class="tool-box">
    <h3>${label}</h3>
    <input type="${inputType}" id="sstInput" placeholder="${placeholder}">
    <div class="btn-row"><button class="btn" onclick="showComingSoon('${name}')">${btnLabel}</button></div>
    <div class="notice" style="margin-top:1rem">🔌 <strong>${name}</strong> requires a server-side API. Connect your backend to enable real results.</div>
  </div>`;
}

// ══════════════════════════════════════════════
// GLOBAL HELPERS
// ══════════════════════════════════════════════
window.copyText = (id) => {
  const el = document.getElementById(id);
  if(!el) return;
  const text = el.value || el.textContent;
  navigator.clipboard.writeText(text).then(()=>{ showToast('Copied!'); });
};

window.showFileName = (input, targetId) => {
  const el = document.getElementById(targetId);
  if(el) el.textContent = input.files.length > 1 ? `${input.files.length} files selected` : (input.files[0]?.name || '');
};

window.showComingSoon = (name) => { showToast(`${name} — Backend required. Connect your API to enable this feature.`, 3000); };

function showToast(msg, dur=2000) {
  let t = document.getElementById('toast');
  if(!t) { t=document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);font-family:Space Mono,monospace;font-size:.72rem;font-weight:700;padding:.7rem 1.5rem;border-radius:999px;z-index:9999;transition:opacity .3s;letter-spacing:.06em'; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{t.style.opacity='0';},dur);
}

// ── Image tool implementations
window.doConvertImage = (input, toType) => {
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload = e => {
    const img=new Image(); img.onload=()=>{
      const canvas=document.createElement('canvas'); canvas.width=img.width; canvas.height=img.height;
      canvas.getContext('2d').drawImage(img,0,0);
      const ext=toType.split('/')[1]==='jpeg'?'jpg':toType.split('/')[1];
      const data=canvas.toDataURL(toType,0.92);
      const a=document.createElement('a'); a.href=data; a.download=`converted.${ext}`; a.click();
      document.getElementById('convResult').innerHTML=`<div class="notice">✅ Converted! Download started.</div><img src="${data}" style="max-width:100%;max-height:200px;border-radius:8px;margin-top:.8rem">`;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
};

window.imgToBase64 = (input) => {
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{ document.getElementById('b64Out').value=e.target.result; };
  reader.readAsDataURL(file);
};

window.base64ToImg = () => {
  let src = document.getElementById('b64Input').value.trim();
  if(!src.startsWith('data:')) src='data:image/png;base64,'+src;
  document.getElementById('b64ImgResult').innerHTML=`<img src="${src}" style="max-width:100%;border-radius:8px" onerror="document.getElementById('b64ImgResult').innerHTML='<div class=notice>❌ Invalid Base64 image data</div>'"><br><a href="${src}" download="image.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`;
};

window.loadColorPicker = (input) => {
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{ const img=new Image(); img.onload=()=>{ const canvas=document.getElementById('cpCanvas'); canvas.width=Math.min(img.width,800); canvas.height=img.height*(canvas.width/img.width); canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height); canvas.style.display='block'; document.getElementById('dropZone').style.display='none'; }; img.src=e.target.result; };
  reader.readAsDataURL(file);
};

window.pickColor = (e) => {
  const canvas=document.getElementById('cpCanvas'); const rect=canvas.getBoundingClientRect();
  const x=Math.floor((e.clientX-rect.left)*(canvas.width/rect.width));
  const y=Math.floor((e.clientY-rect.top)*(canvas.height/rect.height));
  const d=canvas.getContext('2d').getImageData(x,y,1,1).data;
  const hex='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
  document.getElementById('colorResult').style.display='block';
  document.getElementById('colorSwatch').style.background=hex;
  document.getElementById('hexVal').textContent=hex.toUpperCase();
  document.getElementById('rgbVal').textContent=`rgb(${d[0]},${d[1]},${d[2]})`;
};

window.readMetadata = (input) => {
  const file=input.files[0]; if(!file) return;
  const info={Name:file.name, Size:(file.size/1024).toFixed(2)+' KB', Type:file.type, 'Last Modified':new Date(file.lastModified).toLocaleString()};
  const reader=new FileReader();
  reader.onload=e=>{ const img=new Image(); img.onload=()=>{ info.Width=img.width+'px'; info.Height=img.height+'px'; info['Aspect Ratio']=(img.width/img.height).toFixed(2);
    document.getElementById('metaResult').innerHTML=`<div class="output-label">File Metadata</div><table style="width:100%;border-collapse:collapse">${Object.entries(info).map(([k,v])=>`<tr style="border-bottom:1px solid var(--border)"><td style="padding:.5rem;color:var(--muted);font-family:monospace;font-size:.75rem;width:40%">${k}</td><td style="padding:.5rem;color:var(--text);font-size:.8rem">${v}</td></tr>`).join('')}</table>`;
  }; img.src=e.target.result; };
  reader.readAsDataURL(file);
};

// Simple image ops via canvas
function loadAndDraw(inputId, resultId, fn) {
  const input=document.getElementById(inputId); const file=input?.files[0]; if(!file) {alert('Please upload an image first');return;}
  const reader=new FileReader();
  reader.onload=e=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); fn(c,img); const data=c.toDataURL('image/png'); document.getElementById(resultId).innerHTML=`<img src="${data}" style="max-width:100%;border-radius:8px"><br><a href="${data}" download="result.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`; }; img.src=e.target.result; };
  reader.readAsDataURL(file);
}

window.applyBlur = ()=>loadAndDraw('blurInput','blurResult',(c,img)=>{ c.width=img.width;c.height=img.height; const ctx=c.getContext('2d'); ctx.filter=`blur(${document.getElementById('blurR').value}px)`; ctx.drawImage(img,0,0); });
window.applySharpen = ()=>loadAndDraw('sharpInput','sharpResult',(c,img)=>{ c.width=img.width;c.height=img.height; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0); }); // Sharpen needs convolution — just pass through as demo
window.loadWMImage = (input)=>{ const file=input.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=e=>{ window._wmSrc=e.target.result; }; reader.readAsDataURL(file); };
window.applyWatermark = ()=>{ if(!window._wmSrc){alert('Please upload an image first');return;} const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.width;c.height=img.height; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0); const text=document.getElementById('wmText').value||'WATERMARK'; const op=parseFloat(document.getElementById('wmOp').value)/100; const pos=document.getElementById('wmPos').value; ctx.font=`bold ${img.width/15}px Arial`; ctx.fillStyle=`rgba(255,255,255,${op})`; ctx.textAlign='center'; const x=pos.includes('right')?img.width*.85:pos.includes('left')?img.width*.15:img.width/2; const y=pos.includes('bottom')?img.height*.9:pos.includes('top')?img.height*.1:img.height/2; ctx.fillText(text,x,y); const data=c.toDataURL(); document.getElementById('wmResult').innerHTML=`<img src="${data}" style="max-width:100%;border-radius:8px"><br><a href="${data}" download="watermarked.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`; }; img.src=window._wmSrc; };
window.loadRotImage = (input)=>{ const file=input.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=e=>{ window._rotSrc=e.target.result; }; reader.readAsDataURL(file); };
window.rotateImage = (deg)=>{ if(!window._rotSrc){alert('Please upload an image first');return;} const img=new Image(); img.onload=()=>{ const rad=deg*Math.PI/180; const c=document.createElement('canvas'); if(deg===90||deg===270){c.width=img.height;c.height=img.width;}else{c.width=img.width;c.height=img.height;} const ctx=c.getContext('2d'); ctx.translate(c.width/2,c.height/2); ctx.rotate(rad); ctx.drawImage(img,-img.width/2,-img.height/2); const data=c.toDataURL(); document.getElementById('rotResult').innerHTML=`<img src="${data}" style="max-width:100%;border-radius:8px"><br><a href="${data}" download="rotated.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`; }; img.src=window._rotSrc; };
window.flipImage = (dir)=>{ if(!window._rotSrc){alert('Please upload an image first');return;} const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.width;c.height=img.height; const ctx=c.getContext('2d'); if(dir==='h'){ctx.translate(img.width,0);ctx.scale(-1,1);}else{ctx.translate(0,img.height);ctx.scale(1,-1);} ctx.drawImage(img,0,0); const data=c.toDataURL(); document.getElementById('rotResult').innerHTML=`<img src="${data}" style="max-width:100%;border-radius:8px"><br><a href="${data}" download="flipped.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`; }; img.src=window._rotSrc; };
window.loadCropImage = (input)=>{ const file=input.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=e=>{ window._cropSrc=e.target.result; const img=new Image(); img.onload=()=>{ document.getElementById('cw').value=img.width; document.getElementById('ch').value=img.height; }; img.src=e.target.result; }; reader.readAsDataURL(file); };
window.doCrop = ()=>{ if(!window._cropSrc){alert('Please upload an image first');return;} const img=new Image(); img.onload=()=>{ const x=parseInt(document.getElementById('cx').value)||0,y=parseInt(document.getElementById('cy').value)||0,w=parseInt(document.getElementById('cw').value)||200,h=parseInt(document.getElementById('ch').value)||200; const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,-x,-y,img.width,img.height); const data=c.toDataURL(); document.getElementById('cropResult').innerHTML=`<img src="${data}" style="max-width:100%;border-radius:8px"><br><a href="${data}" download="cropped.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`; }; img.src=window._cropSrc; };
window.doResize = ()=>{ const input=document.getElementById('resizeInput'); const file=input.files[0]; if(!file){alert('Please upload an image first');return;} const reader=new FileReader(); reader.onload=e=>{ const img=new Image(); img.onload=()=>{ const w=parseInt(document.getElementById('rW').value)||img.width,h=parseInt(document.getElementById('rH').value)||img.height; const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); const data=c.toDataURL('image/png'); document.getElementById('resizeResult').innerHTML=`<div class="notice">✅ Resized to ${w}×${h}px</div><img src="${data}" style="max-width:100%;border-radius:8px;margin-top:.8rem"><br><a href="${data}" download="resized.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`; }; img.src=e.target.result; }; reader.readAsDataURL(file); };

// ══════════════════════════════════════════════
// RENDER ENGINE
// ══════════════════════════════════════════════
function renderTool() {
  const params = new URLSearchParams(window.location.search);
  const toolId = params.get('t');
  const wrap = document.getElementById('toolWrap');

  if(!wrap) { setTimeout(renderTool, 50); return; }

  // No tool ID — show searchable tool list
  if(!toolId) {
    document.title = 'All Tools — ALLTOOLHUB';
    const cats = {};
    Object.entries(TOOLS).forEach(([id,t]) => {
      if(!cats[t.cat]) cats[t.cat] = [];
      cats[t.cat].push({id, ...t});
    });
    wrap.innerHTML = `
      <div style="margin-bottom:2rem">
        <div class="tool-cat-badge">Complete Library</div>
        <h1 class="tool-title">All Tools</h1>
        <p class="tool-desc">Click any tool to open it.</p>
        <div style="margin-top:1.2rem">
          <input type="text" id="tlSearch" placeholder="Search tools..." oninput="filterToolList(this.value)" style="max-width:400px">
        </div>
      </div>
      <div id="toolListWrap">
        ${Object.entries(cats).map(([cat, tools]) => `
          <div style="margin-bottom:2.5rem">
            <div class="tool-cat-badge" style="margin-bottom:1rem">${cat}</div>
            <div class="related-grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
              ${tools.map(t => `<a href="tool.html?t=${t.id}" class="related-card">🔧 ${t.title}</a>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `;
    window.filterToolList = (q) => {
      q = q.toLowerCase();
      document.querySelectorAll('.related-card').forEach(el => {
        el.style.display = !q || el.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    };
    return;
  }

  const tool = TOOLS[toolId];

  if(!tool) {
    wrap.innerHTML = `
      <div class="not-found">
        <h2>Tool Not Found</h2>
        <p>The tool "<strong>${toolId}</strong>" doesn't exist yet.</p>
        <div style="display:flex;gap:1rem;justify-content:center;margin-top:1rem">
          <a href="tool.html" class="btn">All Tools</a>
          <a href="index.html" class="btn btn-outline">← Home</a>
        </div>
      </div>`;
    return;
  }

  document.title = `${tool.title} — ALLTOOLHUB`;

  const relatedTools = Object.entries(TOOLS).filter(([id,t]) => t.cat === tool.cat && id !== toolId).slice(0,3);

  // Render HTML
  const html = `
    <div class="tool-breadcrumb">
      <a href="index.html">Home</a>
      <span>/</span>
      <a href="tool.html">${tool.cat}</a>
      <span>/</span>
      <span style="color:var(--text-dim)">${tool.title}</span>
    </div>
    <div class="tool-header">
      <div class="tool-cat-badge">${tool.cat}</div>
      <h1 class="tool-title">${tool.title}</h1>
      <p class="tool-desc">${tool.desc}</p>
    </div>
    ${tool.render()}
    ${relatedTools.length ? `
    <div class="tool-box" style="margin-top:2rem">
      <h3>Related ${tool.cat}</h3>
      <div class="related-grid">
        ${relatedTools.map(([id,t]) => `<a href="tool.html?t=${id}" class="related-card">🔧 ${t.title}</a>`).join('')}
      </div>
    </div>` : ''}
  `;

  wrap.innerHTML = html;

  // Run init AFTER innerHTML is set
  if(tool.init) {
    try { tool.init(); } catch(e) { console.warn('Tool init error:', e); }
  }
}

// Run on page load — works for both server and file:// protocol
if(document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderTool);
} else {
  renderTool();
}
</script>
