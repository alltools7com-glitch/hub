<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool — ALLTOOLHUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg:#12121a; --surface:#1a1a26; --surface2:#22223a;
      --border:#2e2e45; --border2:#44446a;
      --accent:#d4ff00; --accent2:#ff6b35;
      --muted:#6a6a88; --text:#eeeeff; --text-dim:#a0a0c0;
      --card-bg:#1e1e30;
    }

    /* ── LIGHT MODE ── */
    body.light-mode {
      --bg:#f4f4f0; --surface:#ffffff; --surface2:#eeeee8;
      --border:#d8d8cc; --border2:#bbbba8;
      --accent:#7ab800; --accent2:#ff6b35;
      --muted:#888878; --text:#1a1a18; --text-dim:#55554a;
      --card-bg:#fafaf6;
    }
    body.light-mode header{background:rgba(244,244,240,.97);}
    body.light-mode ::-webkit-scrollbar-track{background:var(--bg)}
    body.light-mode select option{background:var(--surface2);color:var(--text)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}

    /* HEADER */
    header{position:sticky;top:0;z-index:100;background:rgba(18,18,26,.95);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
    .h-inner{max-width:1400px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:62px;gap:1rem}
    .logo-wrap{display:flex;align-items:center;gap:.55rem;text-decoration:none;flex-shrink:0}
    .logo-icon{width:36px;height:36px;flex-shrink:0}
    .logo-text{font-family:'Bebas Neue',sans-serif;font-size:1.75rem;letter-spacing:.06em;color:var(--accent);line-height:1}
    .logo-text span{color:var(--text)}
    .back-btn{font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.06em;color:var(--text-dim);border:1px solid var(--border2);background:none;padding:.38rem .85rem;border-radius:4px;cursor:pointer;text-decoration:none;transition:all .2s;display:inline-flex;align-items:center;gap:.4rem}
    .back-btn:hover{color:var(--accent);border-color:var(--accent)}

    /* Theme toggle */
    .theme-toggle{width:44px;height:24px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;cursor:pointer;position:relative;transition:all .3s;flex-shrink:0;display:flex;align-items:center;padding:3px}
    .theme-toggle::after{content:'';width:16px;height:16px;background:var(--accent);border-radius:50%;transition:transform .3s,background .3s;display:block}
    body.light-mode .theme-toggle::after{transform:translateX(20px)}
    .theme-toggle:hover{border-color:var(--accent)}
    .theme-icon{font-size:.78rem;color:var(--text-dim);flex-shrink:0}
    .theme-wrap{display:flex;align-items:center;gap:.5rem}

    /* TOOL PAGE */
    .tool-wrap{max-width:960px;margin:0 auto;padding:3rem 2rem 5rem}
    .tool-breadcrumb{font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:1.8rem;display:flex;align-items:center;gap:.5rem}
    .tool-breadcrumb a{color:var(--muted);text-decoration:none;transition:color .2s}.tool-breadcrumb a:hover{color:var(--accent)}
    .tool-breadcrumb span{color:var(--border2)}

    .tool-header{margin-bottom:2.5rem}
    .tool-cat-badge{font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(212,255,0,.35);display:inline-block;padding:.22rem .6rem;border-radius:2px;margin-bottom:.9rem}
    .tool-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.2rem,5vw,3.5rem);letter-spacing:.03em;line-height:1;color:var(--text);margin-bottom:.6rem}
    .tool-desc{color:var(--text-dim);font-size:.95rem;line-height:1.7;max-width:640px}

    /* TOOL BODY */
    .tool-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:2rem;margin-bottom:1.5rem}
    .tool-box h3{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:1.2rem}

    /* Generic inputs */
    textarea, input[type=text], input[type=number], input[type=date], input[type=url], select {
      width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;
      padding:.75rem 1rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.92rem;
      outline:none;transition:border-color .2s;resize:vertical
    }
    textarea:focus, input:focus, select:focus{border-color:var(--accent)}
    textarea{min-height:160px}
    select option{background:var(--surface2)}

    .btn{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;
      background:var(--accent);color:var(--bg);border:none;padding:.75rem 1.8rem;border-radius:6px;
      cursor:pointer;font-weight:700;transition:all .2s;display:inline-flex;align-items:center;gap:.45rem}
    .btn:hover{background:#eeff44;transform:translateY(-1px);box-shadow:0 6px 20px rgba(212,255,0,.25)}
    .btn-outline{background:none;border:1px solid var(--border2);color:var(--text-dim)}
    .btn-outline:hover{border-color:var(--accent);color:var(--accent);background:none;box-shadow:none;transform:none}
    .btn-row{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.2rem}

    .output-area{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:1rem;
      min-height:100px;font-family:'Space Mono',monospace;font-size:.78rem;color:var(--text);
      white-space:pre-wrap;word-break:break-all;line-height:1.6}
    .output-label{font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;margin-top:1.2rem}

    .row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    @media(max-width:600px){.row2{grid-template-columns:1fr}}

    label{font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.4rem}

    /* Range */
    input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--border2);border-radius:2px;border:none;padding:0}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--accent);border-radius:50%;cursor:pointer}

    /* File drop */
    .drop-zone{border:2px dashed var(--border2);border-radius:12px;padding:3rem 2rem;text-align:center;
      cursor:pointer;transition:all .2s}
    .drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(212,255,0,.04)}
    .drop-icon{font-size:2.5rem;margin-bottom:.7rem}
    .drop-text{font-size:.85rem;color:var(--text-dim)}
    .drop-text strong{color:var(--accent)}

    /* Stats row */
    .stats-row{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:1rem}
    .stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.75rem 1.2rem;flex:1;min-width:100px;text-align:center}
    .stat-val{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--accent);line-height:1}
    .stat-lbl{font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.2rem}

    /* Password strength */
    .strength-bar{height:5px;border-radius:3px;margin-top:.6rem;transition:all .3s;background:var(--border2)}

    /* Color swatch */
    .color-swatch{width:100%;height:80px;border-radius:8px;border:1px solid var(--border2);margin-bottom:.8rem;transition:background .2s}

    /* QR placeholder */
    .qr-preview{width:200px;height:200px;background:white;border-radius:12px;margin:1rem auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#555}

    /* Notice */
    .notice{background:rgba(212,255,0,.06);border:1px solid rgba(212,255,0,.2);border-radius:8px;padding:.9rem 1.2rem;font-size:.82rem;color:var(--text-dim);line-height:1.6}
    .notice strong{color:var(--accent)}

    /* Not found */
    .not-found{text-align:center;padding:5rem 2rem}
    .not-found h2{font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--text);margin-bottom:.5rem}
    .not-found p{color:var(--text-dim);margin-bottom:1.5rem}

    /* Related tools */
    .related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem;margin-top:1.2rem}
    @media(max-width:600px){.related-grid{grid-template-columns:1fr 1fr}}
    .related-card{background:var(--card-bg);border:1px solid var(--border2);border-radius:10px;padding:1rem;text-decoration:none;color:var(--text-dim);transition:all .2s;font-size:.78rem;display:flex;align-items:center;gap:.6rem}
    .related-card:hover{border-color:var(--accent);color:var(--accent);background:rgba(212,255,0,.04)}

    @keyframes fup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .tool-header,.tool-box{animation:fup .4s ease both}
    .tool-box:nth-child(2){animation-delay:.07s}
  </style>
</head>
<body>

<header>
  <div class="h-inner">
    <a href="index.html" class="logo-wrap">
      <svg class="logo-icon" viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="8" fill="#d4ff00"/>
        <rect x="6" y="14" width="24" height="16" rx="2.5" fill="#0d0d0f"/>
        <rect x="13" y="10" width="10" height="6" rx="2" stroke="#0d0d0f" stroke-width="2.2" fill="none"/>
        <rect x="15.5" y="19" width="5" height="3" rx="1" fill="#d4ff00"/>
        <line x1="6" y1="22" x2="30" y2="22" stroke="#d4ff00" stroke-width="1.5"/>
      </svg>
      <span class="logo-text">ALL<span>TOOL</span>HUB</span>
    </a>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to All Tools</a>
    <div class="theme-wrap">
      <i class="fas fa-moon theme-icon" id="themeIcon"></i>
      <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode" aria-label="Toggle theme"></button>
    </div>
  </div>
</header>

<div class="tool-wrap" id="toolWrap">
  <!-- Tool content injected here by JS -->
</div>

<script>
// ══════════════════════════════════════════════
// API KEY CONFIGURATION
// ⚠️  IMPORTANT: Apna naya Google API key yahan set karein.
//     Purana key revoke ho chuka hai — Google Cloud Console se
//     nayi restricted key banayein aur sirf yahan daalen.
//     Kabhi bhi API key source code mein hardcode na karein!
window.PAGESPEED_API_KEY = "YOUR_NEW_GOOGLE_API_KEY_HERE";
// ══════════════════════════════════════════════
// TOOL DEFINITIONS
// ══════════════════════════════════════════════
const TOOLS = {
  // ── IMAGE TOOLS
  'image-compressor': {
    title: 'Image Compressor', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Reduce image file size by up to 80% with no visible quality loss. Supports JPG, PNG, WebP.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image</h3>
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('imgInput').click()">
          <div class="drop-icon">🗜️</div>
          <div class="drop-text"><strong>Click to upload</strong> or drag & drop<br>JPG, PNG, WebP supported</div>
          <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="compressImage(this)">
        </div>
        <div style="margin-top:1rem">
          <label>Quality: <span id="qualVal">75</span>%</label>
          <input type="range" min="10" max="100" value="75" id="qualSlider" oninput="document.getElementById('qualVal').textContent=this.value">
        </div>
        <div class="btn-row">
          <button class="btn" onclick="compressImage()"><i class="fas fa-compress-alt"></i> Compress Image</button>
        </div>
        <div class="output-label">Result</div>
        <div class="output-area" id="compressOut">Upload an image to see compression results here.</div>
      </div>`,
    init: () => {
      const dz = document.getElementById('dropZone');
      if(dz) {
        dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('dragover')});
        dz.addEventListener('dragleave', ()=>dz.classList.remove('dragover'));
        dz.addEventListener('drop', e=>{e.preventDefault();dz.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f)processCompress(f)});
      }
    }
  },

  'image-resizer': {
    title: 'Image Resizer', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Resize any image to exact pixels or percentage without distortion.',
    render: () => `
      <div class="tool-box">
        <h3>Upload & Resize</h3>
        <div class="drop-zone" onclick="document.getElementById('resizeInput').click()">
          <div class="drop-icon">↔️</div>
          <div class="drop-text"><strong>Click to upload image</strong></div>
          <input type="file" id="resizeInput" accept="image/*" style="display:none" onchange="previewResize(this)">
        </div>
        <div class="row2" style="margin-top:1rem">
          <div><label>Width (px)</label><input type="number" id="rW" value="800" placeholder="Width"></div>
          <div><label>Height (px)</label><input type="number" id="rH" value="600" placeholder="Height"></div>
        </div>
        <div style="margin-top:.8rem"><label><input type="checkbox" id="keepRatio" checked style="width:auto;margin-right:.4rem"> Maintain Aspect Ratio</label></div>
        <div class="btn-row">
          <button class="btn" onclick="doResize()"><i class="fas fa-expand-arrows-alt"></i> Resize Image</button>
        </div>
        <div id="resizeResult"></div>
      </div>`
  },

  'jpg-to-png': {
    title: 'JPG to PNG Converter', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Convert JPG images to transparent-ready PNG format instantly.',
    render: () => convertImageUI('jpg-to-png', 'JPG → PNG', 'image/jpeg', 'image/png', '🔄')
  },

  'png-to-jpg': {
    title: 'PNG to JPG Converter', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Flatten PNG images to JPG for smaller file sizes and wider compatibility.',
    render: () => convertImageUI('png-to-jpg', 'PNG → JPG', 'image/png', 'image/jpeg', '🔄')
  },

  'webp-to-jpg': {
    title: 'WebP to JPG Converter', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Convert modern WebP images to universally supported JPG format.',
    render: () => convertImageUI('webp-to-jpg', 'WebP → JPG', 'image/webp', 'image/jpeg', '🔄')
  },

  'jpg-to-webp': {
    title: 'JPG to WebP Converter', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Convert JPG to WebP for faster web loading and better compression.',
    render: () => convertImageUI('jpg-to-webp', 'JPG → WebP', 'image/jpeg', 'image/webp', '🔄')
  },

  'image-cropper': {
    title: 'Image Cropper', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Crop images to any aspect ratio or custom dimensions with live preview.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image</h3>
        <div class="drop-zone" onclick="document.getElementById('cropInput').click()">
          <div class="drop-icon">✂️</div>
          <div class="drop-text"><strong>Click to upload image</strong> to crop</div>
          <input type="file" id="cropInput" accept="image/*" style="display:none" onchange="loadCropImage(this)">
        </div>
        <div class="row2" style="margin-top:1rem">
          <div><label>Crop X (px)</label><input type="number" id="cx" value="0"></div>
          <div><label>Crop Y (px)</label><input type="number" id="cy" value="0"></div>
          <div><label>Width (px)</label><input type="number" id="cw" value="400"></div>
          <div><label>Height (px)</label><input type="number" id="ch" value="300"></div>
        </div>
        <div class="btn-row">
          <button class="btn" onclick="doCrop()"><i class="fas fa-crop-alt"></i> Crop Image</button>
        </div>
        <div id="cropResult"></div>
      </div>`
  },

  'image-rotator': {
    title: 'Image Rotator', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Rotate or flip images 90°, 180°, 270° or any custom angle.',
    render: () => `
      <div class="tool-box">
        <h3>Upload & Rotate</h3>
        <div class="drop-zone" onclick="document.getElementById('rotInput').click()">
          <div class="drop-icon">🔄</div>
          <div class="drop-text"><strong>Click to upload image</strong></div>
          <input type="file" id="rotInput" accept="image/*" style="display:none" onchange="loadRotImage(this)">
        </div>
        <div style="margin-top:1rem;display:flex;gap:.6rem;flex-wrap:wrap">
          <button class="btn btn-outline" onclick="rotateImage(90)">↻ 90°</button>
          <button class="btn btn-outline" onclick="rotateImage(180)">↻ 180°</button>
          <button class="btn btn-outline" onclick="rotateImage(270)">↻ 270°</button>
          <button class="btn btn-outline" onclick="flipImage('h')">↔ Flip H</button>
          <button class="btn btn-outline" onclick="flipImage('v')">↕ Flip V</button>
        </div>
        <div id="rotResult" style="margin-top:1rem"></div>
      </div>`
  },

  'image-to-base64': {
    title: 'Image to Base64', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Encode any image to Base64 string for embedding in HTML or CSS.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image</h3>
        <div class="drop-zone" onclick="document.getElementById('b64In').click()">
          <div class="drop-icon">🖼️→📝</div>
          <div class="drop-text"><strong>Click to upload image</strong></div>
          <input type="file" id="b64In" accept="image/*" style="display:none" onchange="imgToBase64(this)">
        </div>
        <div class="output-label">Base64 Output</div>
        <textarea class="output-area" id="b64Out" style="min-height:120px" readonly placeholder="Base64 string will appear here..."></textarea>
        <div class="btn-row">
          <button class="btn" onclick="copyText('b64Out')"><i class="fas fa-copy"></i> Copy Base64</button>
        </div>
      </div>`,
    init: () => {}
  },

  'base64-to-image': {
    title: 'Base64 to Image', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Decode a Base64 string back into a viewable and downloadable image.',
    render: () => `
      <div class="tool-box">
        <h3>Paste Base64 String</h3>
        <textarea id="b64Input" placeholder="Paste base64 string here (with or without data:image/... prefix)..." style="min-height:140px"></textarea>
        <div class="btn-row">
          <button class="btn" onclick="base64ToImg()"><i class="fas fa-image"></i> Convert to Image</button>
        </div>
        <div id="b64ImgResult" style="margin-top:1rem"></div>
      </div>`
  },

  'image-watermark': {
    title: 'Image Watermark Tool', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Add text or logo watermarks to images with custom opacity and position.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image</h3>
        <div class="drop-zone" onclick="document.getElementById('wmInput').click()">
          <div class="drop-icon">©️</div>
          <div class="drop-text"><strong>Click to upload image</strong></div>
          <input type="file" id="wmInput" accept="image/*" style="display:none" onchange="loadWMImage(this)">
        </div>
        <div style="margin-top:1rem">
          <label>Watermark Text</label>
          <input type="text" id="wmText" value="© ALLTOOLHUB" placeholder="Your watermark text">
        </div>
        <div class="row2" style="margin-top:.8rem">
          <div><label>Position</label>
            <select id="wmPos">
              <option value="bottom-right">Bottom Right</option>
              <option value="bottom-left">Bottom Left</option>
              <option value="top-right">Top Right</option>
              <option value="top-left">Top Left</option>
              <option value="center">Center</option>
            </select>
          </div>
          <div><label>Opacity: <span id="wmOpVal">60</span>%</label>
            <input type="range" min="10" max="100" value="60" oninput="document.getElementById('wmOpVal').textContent=this.value" id="wmOp">
          </div>
        </div>
        <div class="btn-row"><button class="btn" onclick="applyWatermark()"><i class="fas fa-stamp"></i> Apply Watermark</button></div>
        <div id="wmResult" style="margin-top:1rem"></div>
      </div>`
  },

  'image-color-picker': {
    title: 'Image Color Picker', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'Pick any color from an uploaded image and get its HEX, RGB, HSL values.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image & Click to Pick Color</h3>
        <div class="drop-zone" id="cpDrop" onclick="document.getElementById('cpInput').click()">
          <div class="drop-icon">🎨</div>
          <div class="drop-text"><strong>Click to upload image</strong><br>Then click anywhere on the image to pick a color</div>
          <input type="file" id="cpInput" accept="image/*" style="display:none" onchange="loadColorPicker(this)">
        </div>
        <canvas id="cpCanvas" style="display:none;max-width:100%;border-radius:8px;cursor:crosshair;margin-top:1rem" onclick="pickColor(event)"></canvas>
        <div id="colorResult" style="margin-top:1rem;display:none">
          <div class="color-swatch" id="colorSwatch"></div>
          <div class="stats-row">
            <div class="stat-box"><div class="stat-val" id="hexVal" style="font-size:1.1rem;font-family:monospace">#000000</div><div class="stat-lbl">HEX</div></div>
            <div class="stat-box"><div class="stat-val" id="rgbVal" style="font-size:.85rem;font-family:monospace">rgb(0,0,0)</div><div class="stat-lbl">RGB</div></div>
          </div>
        </div>
      </div>`
  },

  'image-metadata': {
    title: 'Image Metadata Viewer', cat: 'Image Tools', catLink: '#image-tools',
    desc: 'View hidden EXIF data: camera, GPS, date, resolution, and more.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image</h3>

  // ── PDF TOOLS (powered by pdf-lib + pdfjs — 100% browser, no server needed)
  // Helper: load pdf-lib lazily
  'pdf-to-word': {
    title: 'PDF to Word', cat: 'PDF Tools', catLink: '#pdf-tools',
    desc: 'Extract text from PDF and download as a real .docx Word file — browser only.',
    render: () => `<div class="tool-box"><h3>Upload PDF</h3><div class="drop-zone" onclick="document.getElementById('p2wIn').click()"><div class="drop-icon">📄→📝</div><div class="drop-text"><strong>Click to upload PDF</strong><br>Downloads as real <strong>.docx</strong> Word file</div><input type="file" id="p2wIn" accept=".pdf" style="display:none" onchange="pdfToWord(this)"></div><div id="p2wResult" style="margin-top:1rem"></div><div class="notice" style="margin-top:.8rem">ℹ️ Layout/images are not preserved — only text content is extracted. For full formatting use <a href="https://smallpdf.com/pdf-to-word" target="_blank" style="color:var(--accent)">SmallPDF</a>.</div></div>`,
    init: () => {
      window.pdfToWord = (inp) => {
        const f = inp.files[0]; if(!f) return;
        const res = document.getElementById('p2wResult');
        res.innerHTML = '<div class="notice">⏳ Loading libraries...</div>';
        // Load PDF.js first, then docx library
        loadPDFJS(() => {
          loadDocxLib(() => {
            const reader = new FileReader();
            reader.onload = async e => {
              try {
                const pdf = await pdfjsLib.getDocument({data: e.target.result}).promise;
                res.innerHTML = `<div class="notice">⏳ Extracting text from ${pdf.numPages} pages...</div>`;
                const { Document, Paragraph, TextRun, HeadingLevel, Packer } = docx;
                const children = [];
                for(let i = 1; i <= pdf.numPages; i++) {
                  const page = await pdf.getPage(i);
                  const tc = await page.getTextContent();
                  // Page heading
                  children.push(new Paragraph({ text: `Page ${i}`, heading: HeadingLevel.HEADING_2 }));
                  // Group items into lines by Y position
                  const lines = {};
                  tc.items.forEach(item => {
                    const y = Math.round(item.transform[5]);
                    if(!lines[y]) lines[y] = [];
                    lines[y].push(item.str);
                  });
                  Object.keys(lines).sort((a,b)=>b-a).forEach(y => {
                    const lineText = lines[y].join(' ').trim();
                    if(lineText) children.push(new Paragraph({ children: [new TextRun(lineText)] }));
                  });
                  children.push(new Paragraph({ text: '' })); // spacer
                }
                const doc = new Document({ sections: [{ children }] });
                const blob = await Packer.toBlob(doc);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = f.name.replace(/\.pdf$/i, '.docx');
                a.click();
                res.innerHTML = `<div class="notice">✅ Done! ${pdf.numPages} pages converted to <strong>.docx</strong> — check your downloads!</div>`;
              } catch(err) {
                res.innerHTML = `<div class="notice">❌ Error: ${err.message}</div>`;
              }
            };
            reader.readAsArrayBuffer(f);
          });
        });
      };
      // Lazy loader for docx library
      window.loadDocxLib = (cb) => {
        if(window.docx) { cb(); return; }
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js';
        s.onload = cb;
        s.onerror = () => alert('Failed to load docx library. Check your internet connection.');
        document.head.appendChild(s);
      };
    }
  },

    init: () => { window.pdfToExcel=(inp)=>{const f=inp.files[0];if(!f)return;const res=document.getElementById('p2eResult');res.innerHTML='<div class="notice">⏳ Extracting text...</div>';loadPDFJS(()=>{const reader=new FileReader();reader.onload=async e=>{try{const pdf=await pdfjsLib.getDocument({data:e.target.result}).promise;let rows=[];for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const tc=await page.getTextContent();const line=tc.items.map(s=>s.str.replace(/,/g,';')).join(',');rows.push(`Page ${i},${line}`);}const csv=rows.join('\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name.replace('.pdf','.csv');a.click();res.innerHTML=`<div class="notice">✅ Extracted ${rows.length} rows — CSV downloaded!</div>`;}catch(e){res.innerHTML=`<div class="notice">❌ ${e.message}</div>`;}};reader.readAsArrayBuffer(f);});}; }

  'case-converter': {
    title: 'Case Converter', cat: 'Text Tools', catLink: '#text-tools',
    desc: 'Switch text between UPPER, lower, Title Case, camelCase and more.',
    render: () => `
      <div class="tool-box">
        <h3>Enter Text</h3>
        <textarea id="caseIn" placeholder="Type or paste text here..." style="min-height:150px"></textarea>
        <div class="btn-row">
          <button class="btn btn-outline" onclick="convertCase('upper')">UPPERCASE</button>
          <button class="btn btn-outline" onclick="convertCase('lower')">lowercase</button>
          <button class="btn btn-outline" onclick="convertCase('title')">Title Case</button>
          <button class="btn btn-outline" onclick="convertCase('camel')">camelCase</button>
          <button class="btn btn-outline" onclick="convertCase('snake')">snake_case</button>
          <button class="btn btn-outline" onclick="convertCase('sentence')">Sentence case</button>
        </div>
        <div class="output-label">Result</div>
        <textarea id="caseOut" class="output-area" style="min-height:120px" readonly></textarea>
        <div class="btn-row"><button class="btn" onclick="copyText('caseOut')"><i class="fas fa-copy"></i> Copy Result</button></div>
      </div>`,
    init: () => { window.convertCase = function(type) {
      const t = document.getElementById('caseIn').value;
      let r = t;
      if(type==='upper') r = t.toUpperCase();
      else if(type==='lower') r = t.toLowerCase();
      else if(type==='title') r = t.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.substr(1).toLowerCase());
      else if(type==='camel') r = t.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (m, chr) => chr.toUpperCase());
      else if(type==='snake') r = t.toLowerCase().replace(/\s+/g,'_');
      else if(type==='sentence') r = t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
      document.getElementById('caseOut').value = r;
    }}
  },

    render: () => `

          <button class="btn btn-outline" onclick="sortLines('za')">Z → A</button>

    init: () => { window.genRandText = function() {

  'html-formatter': {
    title: 'HTML Formatter', cat: 'Developer Tools', catLink: '#dev-tools',
    desc: 'Indent and clean up minified or messy HTML code.',
    render: () => `
      <div class="tool-box">
        <h3>Input HTML</h3>
        <textarea id="hfIn" placeholder="Paste HTML code here..." style="min-height:180px;font-family:monospace;font-size:.78rem"></textarea>
        <div class="btn-row"><button class="btn" onclick="formatHTML()"><i class="fas fa-code"></i> Format HTML</button></div>
        <div class="output-label">Formatted Output</div>
        <textarea id="hfOut" class="output-area" readonly style="min-height:200px;font-size:.78rem"></textarea>
        <div class="btn-row"><button class="btn btn-outline" onclick="copyText('hfOut')">Copy</button></div>
      </div>`,
    init: () => { window.formatHTML = () => {
      let h = document.getElementById('hfIn').value;
      let indent = 0;
      h = h.replace(/></g, '>\n<').replace(/^\s+|\s+$/gm,'');
      const lines = h.split('\n');
      let out = '';
      lines.forEach(line => {
        if(line.match(/^<\//)) indent = Math.max(0, indent-1);
        out += '  '.repeat(indent) + line.trim() + '\n';
        if(line.match(/^<[^\/!]/) && !line.match(/\/>$/) && !line.match(/<\//) && !['<br','<hr','<img','<input','<link','<meta'].some(t=>line.startsWith(t))) indent++;
      });
      document.getElementById('hfOut').value = out.trim();
    }}
  },

          <div><label>Date of Birth</label><input type="date" id="dob" max="${new Date().toISOString().split('T')[0]}"></div>

        </div>
        <div class="btn-row"><button class="btn" onclick="calcAge()"><i class="fas fa-birthday-cake"></i> Calculate Age</button></div>
        <div class="stats-row" id="ageResult" style="display:none">

      document.getElementById('ageMo').textContent = m;
      document.getElementById('ageDy').textContent = d;

    render: () => `

          <div><label>Height (cm)</label><input type="number" id="bmiH" placeholder="e.g. 175"></div>

        <div id="bmiResult" style="margin-top:1rem"></div>
      </div>`,
    init: () => { window.calcBMI = () => {
      const h = parseFloat(document.getElementById('bmiH').value)/100;
      const w = parseFloat(document.getElementById('bmiW').value);

      const bmi = (w/(h*h)).toFixed(1);

    desc: 'Convert any numeric value into written English words.',

      if(isNaN(n)){document.getElementById('ntwOut').textContent='Please enter a valid number';return;}
      const ones=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
      const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
      function toW(n){if(n===0)return'zero';if(n<0)return'negative '+toW(-n);if(n<20)return ones[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');if(n<1000)return ones[Math.floor(n/100)]+' hundred'+(n%100?' '+toW(n%100):'');if(n<1000000)return toW(Math.floor(n/1000))+' thousand'+(n%1000?' '+toW(n%1000):'');return toW(Math.floor(n/1000000))+' million'+(n%1000000?' '+toW(n%1000000):'');}
      document.getElementById('ntwOut').textContent = toW(n);
    }}
  },

        </div>

        weight:{kg:1,'g':1000,'mg':1e6,'lb':2.20462,'oz':35.274,'t':0.001},
        speed:{'m/s':1,'km/h':3.6,'mph':2.23694,'knot':1.94384},
        temp:{celsius:null,fahrenheit:null,kelvin:null}
      };
      window.loadUnitOptions = () => {
        const cat = document.getElementById('ucCat').value;
        const keys = Object.keys(units[cat]);
        const opts = keys.map(k=>`<option value="${k}">${k}</option>`).join('');
        document.getElementById('ucFrom').innerHTML = opts;
        document.getElementById('ucTo').innerHTML = opts;
        document.getElementById('ucTo').selectedIndex = 1;
        convertUnit();
      };
      window.convertUnit = () => {
        const cat = document.getElementById('ucCat').value;
        const from = document.getElementById('ucFrom').value;
        const to = document.getElementById('ucTo').value;
        const val = parseFloat(document.getElementById('ucVal').value);
        if(isNaN(val)) return;
        let result;
        if(cat==='temp') {
          let celsius;
          if(from==='celsius') celsius=val;
          else if(from==='fahrenheit') celsius=(val-32)*5/9;
          else celsius=val-273.15;
          if(to==='celsius') result=celsius;
          else if(to==='fahrenheit') result=celsius*9/5+32;
          else result=celsius+273.15;
        } else {
          const base = val / units[cat][from];
          result = base * units[cat][to];
        }
        document.getElementById('ucOut').textContent = `${val} ${from} = ${result.toFixed(6)} ${to}`;
      };
      loadUnitOptions();
    }
  },

      </div>`,
    init: () => { window.htmlToMD = () => {
      let h = document.getElementById('htmIn').value;
      h = h.replace(/<h1[^>]*>(.*?)<\/h1>/gi,'# $1\n').replace(/<h2[^>]*>(.*?)<\/h2>/gi,'## $1\n').replace(/<h3[^>]*>(.*?)<\/h3>/gi,'### $1\n');
      h = h.replace(/<strong[^>]*>(.*?)<\/strong>/gi,'**$1**').replace(/<b[^>]*>(.*?)<\/b>/gi,'**$1**');
      h = h.replace(/<em[^>]*>(.*?)<\/em>/gi,'*$1*').replace(/<i[^>]*>(.*?)<\/i>/gi,'*$1*');
      h = h.replace(/<a[^>]*href="([^"]*)"[^>]*>(.*?)<\/a>/gi,'[$2]($1)');
      h = h.replace(/<img[^>]*src="([^"]*)"[^>]*alt="([^"]*)"[^>]*>/gi,'![$2]($1)');

      h = h.replace(/<li[^>]*>(.*?)<\/li>/gi,'- $1\n');
      h = h.replace(/<p[^>]*>(.*?)<\/p>/gi,'$1\n\n');
      h = h.replace(/<br\s*\/?>/gi,'\n');
      h = h.replace(/<[^>]+>/g,'').replace(/\n{3,}/g,'\n\n').trim();
      document.getElementById('htmOut').value = h;

        <textarea id="aiText" placeholder="Paste the text you want to analyze for AI content..." style="min-height:200px"></textarea>
        <div class="btn-row"><button class="btn" onclick="detectAI()"><i class="fas fa-bolt"></i> Analyze Text</button></div>
        <div id="aiResult" style="margin-top:1rem"></div>
        <div class="notice" style="margin-top:1rem">⚠️ <strong>Disclaimer:</strong> AI detection is not 100% accurate. Results are indicative only.</div>
      </div>`,
    init: () => { window.detectAI = () => {
      const text = document.getElementById('aiText').value;
      if(text.length < 100){document.getElementById('aiResult').innerHTML='<div class="notice">Please enter at least 100 characters for analysis.</div>';return;}
      const words = text.split(/\s+/);
      const avgWordLen = words.reduce((a,w)=>a+w.length,0)/words.length;
      const sentences = text.split(/[.!?]+/).filter(s=>s.trim());
      const avgSentLen = words.length / sentences.length;
      const uniqueWords = new Set(words.map(w=>w.toLowerCase())).size;
      const lexDiversity = uniqueWords / words.length;
      const score = Math.min(100, Math.max(0, Math.round(
        (avgWordLen > 5 ? 20 : 0) + (avgSentLen > 20 ? 15 : 0) + (lexDiversity < 0.5 ? 25 : 0) + Math.random()*40
      )));
      const isAI = score > 50;
      const col = isAI ? '#FC8181' : '#68D391';
      document.getElementById('aiResult').innerHTML = `<div class="stats-row">
        <div class="stat-box"><div class="stat-val" style="color:${col}">${score}%</div><div class="stat-lbl">AI Probability</div></div>
        <div class="stat-box"><div class="stat-val" style="color:${col};font-size:1.2rem">${isAI?'Likely AI':'Likely Human'}</div><div class="stat-lbl">Verdict</div></div>
        <div class="stat-box"><div class="stat-val">${(lexDiversity*100).toFixed(0)}%</div><div class="stat-lbl">Lexical Diversity</div></div>
      </div>`;
    }}
  },

  'ocr': {
    title: 'Image to Text (OCR)', cat: 'Advanced Tools', catLink: '#advanced-tools',
    desc: 'Extract editable text from images, scanned documents, or screenshots.',
    render: () => `
      <div class="tool-box">
        <h3>Upload Image for OCR</h3>
        <div class="drop-zone" onclick="document.getElementById('ocrInput').click()">
          <div class="drop-icon">🔍</div>
          <div class="drop-text"><strong>Click to upload image</strong><br>JPG, PNG, scanned documents</div>
          <input type="file" id="ocrInput" accept="image/*" style="display:none" onchange="doOCR(this)">
        </div>
        <div id="ocrPreview" style="margin-top:1rem"></div>
        <div class="output-label">Extracted Text</div>
        <textarea id="ocrOut" class="output-area" readonly style="min-height:180px" placeholder="Text will appear here after OCR processing..."></textarea>
        <div class="btn-row"><button class="btn btn-outline" onclick="copyText('ocrOut')">Copy Text</button></div>

      </div>`,
    init: () => { window.doOCR = (input) => {
      const file = input.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('ocrPreview').innerHTML = `<img src="${e.target.result}" style="max-width:100%;max-height:200px;border-radius:8px;margin-bottom:.8rem">`;
        document.getElementById('ocrOut').value = 'Processing OCR... (Tesseract.js required — loading)';
        if(window.Tesseract) {
          Tesseract.recognize(e.target.result,'eng').then(({data:{text}})=>{ document.getElementById('ocrOut').value=text; });
        } else {
          const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js';
          s.onload=()=>{ Tesseract.recognize(e.target.result,'eng',{logger:m=>console.log(m)}).then(({data:{text}})=>{ document.getElementById('ocrOut').value=text; }); };
          document.head.appendChild(s);
        }
      };
      reader.readAsDataURL(file);
    }}
  },

  // ── SEO TOOLS (real implementations)
  'meta-tag-analyzer': {
    title:'Meta Tag Analyzer', cat:'SEO Tools', catLink:'#seo-tools',
    desc:'Fetch and analyze any website\'s meta tags for SEO using a proxy API.',
    render: () => `<div class="tool-box"><h3>Enter Website URL</h3><input type="url" id="mtaUrl" placeholder="https://example.com"><div class="btn-row"><button class="btn" onclick="analyzeMeta()"><i class="fas fa-bolt"></i> 🔍 Analyze Meta Tags</button></div><div id="mtaResult" style="margin-top:1rem"></div></div>`,
    init: () => { window.analyzeMeta=async()=>{ const url=document.getElementById('mtaUrl').value.trim(); if(!url){alert('Enter a URL');return;} const res=document.getElementById('mtaResult'); res.innerHTML='<div class="notice">⏳ Fetching page...</div>'; try{ const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`); const d=await r.json(); const parser=new DOMParser(); const doc=parser.parseFromString(d.contents,'text/html'); const getMeta=name=>doc.querySelector(`meta[name="${name}"]`)?.content||doc.querySelector(`meta[property="og:${name}"]`)?.content||'—'; const title=doc.querySelector('title')?.textContent||'—'; const desc=getMeta('description'); const ogTitle=doc.querySelector('meta[property="og:title"]')?.content||'—'; const ogImg=doc.querySelector('meta[property="og:image"]')?.content||'—'; const canonical=doc.querySelector('link[rel="canonical"]')?.href||'—'; const robots=getMeta('robots'); const viewport=doc.querySelector('meta[name="viewport"]')?.content||'—'; const titleLen=title.length; const descLen=desc.length; res.innerHTML=`<div class="notice">✅ Meta tags for <strong>${url}</strong></div><div style="margin-top:.8rem;display:flex;flex-direction:column;gap:.5rem">${[['📝 Title',title,`${titleLen} chars ${titleLen<50?'⚠️ Too short':titleLen>60?'⚠️ Too long':'✅'}`],['📄 Description',desc,`${descLen} chars ${descLen<120?'⚠️ Too short':descLen>160?'⚠️ Too long':'✅'}`],['🔗 Canonical',canonical,''],['🤖 Robots',robots,''],['📱 Viewport',viewport,''],['🖼️ OG Title',ogTitle,''],['🖼️ OG Image',ogImg,'']].map(([l,v,note])=>`<div style="background:var(--surface2);border-radius:8px;padding:.7rem 1rem"><div style="font-family:monospace;font-size:.65rem;color:var(--accent);text-transform:uppercase;margin-bottom:.2rem">${l} ${note?`<span style="color:var(--text-dim)">${note}</span>`:''}</div><div style="font-size:.8rem;color:var(--text-dim);word-break:break-all">${v}</div></div>`).join('')}</div>`; }catch(e){ res.innerHTML=`<div class="notice">❌ Could not fetch page. CORS may be blocking it.</div>`; } }; }
  },
  'sitemap-generator': {
    title:'Sitemap Generator', cat:'SEO Tools', catLink:'#seo-tools',
    desc:'Generate an XML sitemap manually by entering your page URLs.',
    render: () => `<div class="tool-box"><h3>Your Website Pages</h3><textarea id="smUrls" placeholder="https://example.com/&#10;https://example.com/about&#10;https://example.com/contact&#10;https://example.com/blog" style="min-height:160px"></textarea><div class="row2" style="margin-top:.8rem"><div><label>Change Frequency</label><select id="smFreq"><option>weekly</option><option>daily</option><option>monthly</option><option>yearly</option><option>always</option><option>never</option></select></div><div><label>Priority</label><select id="smPri"><option value="0.8">0.8 (High)</option><option value="0.5" selected>0.5 (Medium)</option><option value="0.3">0.3 (Low)</option><option value="1.0">1.0 (Homepage)</option></select></div></div><div class="btn-row"><button class="btn" onclick="generateSitemap()"><i class="fas fa-bolt"></i> 🗺️ Generate Sitemap</button></div><div class="output-label">Generated sitemap.xml</div><textarea id="smOut" class="output-area" readonly style="min-height:200px;font-family:monospace;font-size:.72rem"></textarea><div class="btn-row"><button class="btn btn-outline" onclick="copyText('smOut')">Copy XML</button><button class="btn btn-outline" onclick="downloadSitemap()">Download sitemap.xml</button></div></div>`,
    init: () => { window.generateSitemap=()=>{ const urls=document.getElementById('smUrls').value.trim().split('\n').filter(u=>u.trim()); if(!urls.length){alert('Enter at least one URL');return;} const freq=document.getElementById('smFreq').value; const pri=document.getElementById('smPri').value; const today=new Date().toISOString().split('T')[0]; const xml=`<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${urls.map((u,i)=>`  <url>\n    <loc>${u.trim()}</loc>\n    <lastmod>${today}</lastmod>\n    <changefreq>${freq}</changefreq>\n    <priority>${i===0?'1.0':pri}</priority>\n  </url>`).join('\n')}\n</urlset>`; document.getElementById('smOut').value=xml; }; window.downloadSitemap=()=>{ const t=document.getElementById('smOut').value; if(!t.trim()){alert('Generate sitemap first');return;} const blob=new Blob([t],{type:'application/xml'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sitemap.xml'; a.click(); }; }
  },
  'google-index-checker': {
    title:'Google Index Checker', cat:'SEO Tools', catLink:'#seo-tools',
    desc:'Check if a URL appears in Google Search results.',
    render: () => `<div class="tool-box"><h3>Enter URL to Check</h3><input type="url" id="gicUrl" placeholder="https://example.com/page"><div class="btn-row"><button class="btn" onclick="checkGoogleIndex()"><i class="fas fa-search"></i> 🔍 Check Index Status</button></div><div id="gicResult" style="margin-top:1rem"></div></div>`,
    init: () => { window.checkGoogleIndex=()=>{ const url=document.getElementById('gicUrl').value.trim(); if(!url){alert('Enter a URL');return;} const res=document.getElementById('gicResult'); const searchUrl=`https://www.google.com/search?q=site:${encodeURIComponent(url)}`; res.innerHTML=`<div class="notice">ℹ️ Google blocks direct API access, but you can verify manually:<br><br><a href="${searchUrl}" target="_blank" class="btn" style="display:inline-flex">🔍 Check on Google (site:${url})</a><br><br>If results appear = ✅ Indexed<br>If "No results found" = ❌ Not indexed yet</div>`; }; }

  'domain-authority': {
    title:'Domain Authority Checker', cat:'SEO Tools', catLink:'#seo-tools',
    desc:'Estimate domain authority based on age, DNS and web presence.',
    render: () => `<div class="tool-box"><h3>Enter Domain</h3><input type="text" id="daIn" placeholder="example.com"><div class="btn-row"><button class="btn" onclick="checkDA()"><i class="fas fa-search"></i> 📊 Check Domain Info</button></div><div id="daResult" style="margin-top:1rem"></div><div class="notice" style="margin-top:.8rem">ℹ️ Official DA score (by Moz) requires a paid API. This shows free domain health info. For real DA use <a href="https://moz.com/domain-analysis" target="_blank" style="color:var(--accent)">Moz</a> or <a href="https://ahrefs.com/website-authority-checker" target="_blank" style="color:var(--accent)">Ahrefs</a>.</div></div>`,
    init: () => { window.checkDA=async()=>{ const domain=document.getElementById('daIn').value.trim().replace(/^https?:\/\//,''); if(!domain){alert('Enter a domain');return;} const res=document.getElementById('daResult'); res.innerHTML='<div class="notice">⏳ Checking domain info...</div>'; try{ const [rdap,dns,ip]=await Promise.all([ fetch(`https://rdap.org/domain/${domain}`).then(r=>r.json()).catch(()=>({})), fetch(`https://dns.google/resolve?name=${domain}&type=A`).then(r=>r.json()).catch(()=>({})), fetch(`https://dns.google/resolve?name=${domain}&type=MX`).then(r=>r.json()).catch(()=>({})) ]); const created=rdap.events?.find(e=>e.eventAction==='registration')?.eventDate?.split('T')[0]||'Unknown'; const expiry=rdap.events?.find(e=>e.eventAction==='expiration')?.eventDate?.split('T')[0]||'Unknown'; const hasA=!!dns.Answer?.length; const hasMX=!!ip.Answer?.length; const ageYears=created!=='Unknown'?Math.floor((Date.now()-new Date(created))/(365.25*24*3600*1000)):0; const score=Math.min(95,20+(ageYears*5)+(hasA?10:0)+(hasMX?5:0)); res.innerHTML=`<div class="stats-row" style="flex-wrap:wrap;gap:.5rem">${[['📊 Est. Score',`~${score}/100`],['📅 Registered',created],['⏰ Expires',expiry],['✅ Has DNS',hasA?'Yes':'No'],['📧 Has Email',hasMX?'Yes':'No'],['⏱️ Age',ageYears>0?`${ageYears} years`:'< 1 year']].map(([l,v])=>`<div class="stat-box" style="flex:1;min-width:120px"><div class="stat-val" style="font-size:.85rem">${v}</div><div class="stat-lbl">${l}</div></div>`).join('')}</div>`; }catch(e){ res.innerHTML=`<div class="notice">❌ ${e.message}</div>`; } }; }
  },
  'backlink-checker': {
    title:'Backlink Checker', cat:'SEO Tools', catLink:'#seo-tools',
    desc:'Find backlinks for any domain using free open data sources.',
    render: () => `<div class="tool-box"><h3>Enter Domain or URL</h3><input type="text" id="blIn" placeholder="example.com"><div class="btn-row"><button class="btn" onclick="checkBacklinks()"><i class="fas fa-search"></i> 🔗 Check Backlinks</button></div><div id="blResult" style="margin-top:1rem"></div></div>`,
    init: () => { window.checkBacklinks=async()=>{ const domain=document.getElementById('blIn').value.trim().replace(/^https?:\/\//,'').replace(/\//,''); if(!domain){alert('Enter a domain');return;} const res=document.getElementById('blResult'); res.innerHTML='<div class="notice">⏳ Searching backlinks...</div>'; try{ const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://openpagerank.com/api/v1.0/getPageRank?domains[0]=${domain}`)}`); const d=await r.json(); let parsed; try{parsed=JSON.parse(d.contents);}catch(e){parsed=null;} const rank=parsed?.response?.[0]?.page_rank_integer||'N/A'; const rankDec=parsed?.response?.[0]?.page_rank_decimal?.toFixed(2)||'N/A'; res.innerHTML=`<div class="stats-row" style="flex-wrap:wrap;gap:.5rem"><div class="stat-box" style="flex:1;min-width:120px"><div class="stat-val">${rank}/10</div><div class="stat-lbl">Page Rank</div></div><div class="stat-box" style="flex:1;min-width:120px"><div class="stat-val">${rankDec}</div><div class="stat-lbl">Rank Score</div></div></div><div class="notice" style="margin-top:.8rem">For detailed backlinks:<br><a href="https://ahrefs.com/backlink-checker/?target=${domain}" target="_blank" style="color:var(--accent)" class="btn btn-outline" style="display:inline-flex;margin:.3rem">Ahrefs Free</a> <a href="https://www.semrush.com/analytics/backlinks/?q=${domain}" target="_blank" style="color:var(--accent)" class="btn btn-outline">SEMrush</a></div>`; }catch(e){ res.innerHTML=`<div class="notice">⚠️ Could not fetch data. Use free tools:<br><a href="https://ahrefs.com/backlink-checker/?target=${domain}" target="_blank" style="color:var(--accent)">Ahrefs Backlink Checker</a></div>`; } }; }
  },
  'keyword-position': {

    render: () => `<div class="tool-box"><h3>Check Keyword Ranking</h3><div><label>Your Domain</label><input type="text" id="kpDomain" placeholder="example.com"></div><div style="margin-top:.8rem"><label>Keyword</label><input type="text" id="kpKeyword" placeholder="e.g. best free online tools"></div><div class="btn-row"><button class="btn" onclick="checkKwPosition()"><i class="fas fa-search"></i> 📍 Check Ranking</button></div><div id="kpResult" style="margin-top:1rem"></div></div>`,

  'page-speed': {
    title:'Page Speed Checker', cat:'SEO Tools', catLink:'#seo-tools',
    desc:'Test website loading speed using Google PageSpeed Insights API.',
    render: () => `<div class="tool-box"><h3>Enter Website URL</h3><input type="url" id="psUrl" placeholder="https://example.com"><div class="row2" style="margin-top:.8rem"><div><label>Device</label><select id="psDevice"><option value="mobile">Mobile</option><option value="desktop">Desktop</option></select></div></div><div class="btn-row"><button class="btn" onclick="checkPageSpeed()"><i class="fas fa-search"></i> ⚡ Check Speed</button></div><div id="psResult" style="margin-top:1rem"></div></div>`,
    init: () => { window.checkPageSpeed=async()=>{ const url=document.getElementById('psUrl').value.trim(); if(!url){alert('Enter a URL');return;} const device=document.getElementById('psDevice').value; const res=document.getElementById('psResult'); res.innerHTML='<div class="notice">⏳ Running PageSpeed test (may take 10–20 sec)...</div>'; try{ const apiUrl=`https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${encodeURIComponent(url)}&strategy=${device}&key=${window.PAGESPEED_API_KEY||''}`; const r=await fetch(apiUrl); const d=await r.json(); if(d.error){throw new Error(d.error.message);} const cats=d.lighthouseResult?.categories; const perf=Math.round((cats?.performance?.score||0)*100); const acc=Math.round((cats?.accessibility?.score||0)*100); const seo=Math.round((cats?.seo?.score||0)*100); const bp=Math.round((cats?.['best-practices']?.score||0)*100); const color=s=>s>=90?'#68D391':s>=50?'var(--accent)':'#FC8181'; res.innerHTML=`<div class="stats-row" style="flex-wrap:wrap;gap:.5rem">${[['⚡ Performance',perf],['♿ Accessibility',acc],['🔍 SEO',seo],['✅ Best Practices',bp]].map(([l,v])=>`<div class="stat-box" style="flex:1;min-width:120px"><div class="stat-val" style="color:${color(v)}">${v}</div><div class="stat-lbl">${l}</div></div>`).join('')}</div><div class="notice" style="margin-top:.8rem">Scores: ✅ 90-100 Good | ⚠️ 50-89 Average | ❌ 0-49 Poor<br><a href="https://pagespeed.web.dev/report?url=${encodeURIComponent(url)}" target="_blank" style="color:var(--accent)">→ Full Report on PageSpeed Insights</a></div>`; }catch(e){ res.innerHTML=`<div class="notice">⚠️ API limit reached or error. Use <a href="https://pagespeed.web.dev/?url=${encodeURIComponent(url)}" target="_blank" style="color:var(--accent)">pagespeed.web.dev</a> directly.</div>`; } }; }
  },

  'yt-thumbnail': { title:'YouTube Thumbnail DL', cat:'Social Media Tools', catLink:'#social-tools', desc:'Download YouTube thumbnails in HD, HQ, or MaxRes quality.', render: () => `<div class="tool-box"><h3>Enter YouTube URL</h3><input type="text" id="ytUrl" placeholder="https://youtube.com/watch?v=..."><div class="btn-row"><button class="btn" onclick="getYTThumb()"><i class="fas fa-bolt"></i> Get Thumbnail</button></div><div id="ytThumbResult" style="margin-top:1.5rem;text-align:center"></div></div>`, init: () => { window.getYTThumb = () => { const url=document.getElementById('ytUrl').value; const m=url.match(/(?:v=|youtu\.be\/)([^&\s]+)/); if(!m){alert('Invalid YouTube URL');return;} const id=m[1]; const maxres=`https://img.youtube.com/vi/${id}/maxresdefault.jpg`, hq=`https://img.youtube.com/vi/${id}/hqdefault.jpg`; document.getElementById('ytThumbResult').innerHTML=`<img src="${maxres}" onerror="this.src='${hq}'" style="max-width:100%;border-radius:10px"><div class="btn-row" style="justify-content:center;margin-top:1rem"><a href="${maxres}" download="thumbnail.jpg" class="btn">Download MaxRes</a><a href="${hq}" download="thumbnail_hq.jpg" class="btn btn-outline">Download HQ</a></div>`; }; } },
  'yt-title-gen': { title:'YouTube Title Generator', cat:'Social Media Tools', catLink:'#social-tools', desc:'Generate click-worthy video titles optimized for views and SEO.', render: () => `<div class="tool-box"><h3>Describe Your Video</h3><textarea id="ytTopicIn" placeholder="e.g. How to make money online as a beginner" style="min-height:100px"></textarea><div class="btn-row"><button class="btn" onclick="genYTTitles()"><i class="fas fa-bolt"></i> Generate Titles</button></div><div class="output-label">Generated Titles</div><textarea id="ytTitleOut" class="output-area" readonly style="min-height:160px"></textarea><div class="btn-row"><button class="btn btn-outline" onclick="copyText('ytTitleOut')">Copy</button></div></div>`, init: () => { window.genYTTitles = () => { const t=document.getElementById('ytTopicIn').value||'your topic'; const titles=[`How to ${t} (Complete Guide 2025)`,`${t} — What Nobody Tells You`,`I Tried ${t} for 30 Days — Results`,`Top 10 Tips for ${t}`,`The Ultimate ${t} Tutorial for Beginners`,`Why ${t} Changed Everything`,`${t}: Mistakes to Avoid`,`${t} — Step by Step`,`Shocking Truth About ${t}`,`Watch This Before ${t}`]; document.getElementById('ytTitleOut').value=titles.join('\n'); }; } },

  'instagram-dl': {

  'video-converter': {

    init: () => {
      window.loadVideoPreview = (inputId, previewId, nameId) => {
        const file = document.getElementById(inputId).files[0]; if(!file) return;
        if(nameId) document.getElementById(nameId).textContent = file.name + ' (' + (file.size/1024/1024).toFixed(1) + ' MB)';
        const url = URL.createObjectURL(file);
        document.getElementById(previewId).innerHTML = `<video controls style="max-width:100%;border-radius:8px;max-height:180px"><source src="${url}"></video>`;
      };
      window.convertVideo = () => {
        const file = document.getElementById('vcIn').files[0]; if(!file){ alert('Upload a video first'); return; }
        const mimeType = document.getElementById('vcTo').value;
        const res = document.getElementById('vcResult');
        const vBit = parseInt(document.getElementById('vcBitrate').value)*1000;
        const aBit = parseInt(document.getElementById('vcABitrate').value)*1000;
        if(!MediaRecorder.isTypeSupported(mimeType)) {
          res.innerHTML = `<div class="notice">⚠️ Your browser does not support ${mimeType} encoding. Try WebM format.</div>`; return;
        }
        res.innerHTML = '<div class="notice">⏳ Converting... (plays through once, then downloads)</div>';
        const video = document.createElement('video'); video.muted = true;
        const url = URL.createObjectURL(file); video.src = url; video.load();
        video.oncanplay = () => {
          const canvas = document.createElement('canvas');
          video.play().then(() => {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            const stream = canvas.captureStream(30);
            const chunks = []; const mr = new MediaRecorder(stream, {mimeType, videoBitsPerSecond:vBit, audioBitsPerSecond:aBit});
            mr.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
            mr.onstop = () => {
              const blob = new Blob(chunks, {type:mimeType});
              const ext = mimeType.includes('webm')?'webm':'mp4';
              const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`converted.${ext}`; a.click();

              video.pause();
            };
            mr.start();
            const drawFrame = () => { if(video.ended||video.paused){mr.stop();return;} ctx.drawImage(video,0,0); requestAnimationFrame(drawFrame); };
            drawFrame();
            video.onended = () => mr.stop();
          });
        };
      };
    }
  },

              video.pause();

// ── FIX: applySharpen — real convolution sharpening kernel
window.applySharpen = () => {
  if(!window._sharpSrc) { alert('Please upload an image first'); return; }
  const amount = (parseInt(document.getElementById('sharpR')?.value) || 50) / 100;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, c.width, c.height);
    const d = imageData.data;
    const w = c.width, h = c.height;
    const src = new Uint8ClampedArray(d);
    const k = amount;
    // Unsharp mask kernel: center boost, subtract neighbors
    const kernel = [0, -k, 0, -k, 1 + 4 * k, -k, 0, -k, 0];
    for(let y = 1; y < h - 1; y++) {
      for(let x = 1; x < w - 1; x++) {
        const i = (y * w + x) * 4;
        for(let c2 = 0; c2 < 3; c2++) {
          d[i+c2] = Math.min(255, Math.max(0,
            kernel[0]*src[((y-1)*w+(x-1))*4+c2] + kernel[1]*src[((y-1)*w+x)*4+c2] + kernel[2]*src[((y-1)*w+(x+1))*4+c2] +
            kernel[3]*src[(y*w+(x-1))*4+c2]     + kernel[4]*src[i+c2]              + kernel[5]*src[(y*w+(x+1))*4+c2] +
            kernel[6]*src[((y+1)*w+(x-1))*4+c2] + kernel[7]*src[((y+1)*w+x)*4+c2] + kernel[8]*src[((y+1)*w+(x+1))*4+c2]
          ));
        }
      }
    }
    ctx.putImageData(imageData, 0, 0);
    const data = c.toDataURL('image/png');
    document.getElementById('sharpResult').innerHTML =
      `<img src="${data}" style="max-width:100%;border-radius:8px">
       <br><a href="${data}" download="sharpened.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`;
  };
  img.src = window._sharpSrc;
};

// ── FIX: GIF Maker — using gif.js library
window.makeGIF = () => {
  const files = window._gifFrameFiles;
  if(!files || !files.length) { alert('Upload at least 2 images first'); return; }
  const res = document.getElementById('gmResult');
  res.innerHTML = '<div class="notice">⏳ Loading gif.js...</div>';
  const delay = parseInt(document.getElementById('gmDelay')?.value) || 200;
  const loopVal = parseInt(document.getElementById('gmLoop')?.value) || 0;
  const loadGifJS = (cb) => {
    if(window.GIF) { cb(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js';
    s.onload = cb;
    s.onerror = () => { res.innerHTML = '<div class="notice">❌ Could not load gif.js. Try <a href="https://ezgif.com/maker" target="_blank" style="color:var(--accent)">ezgif.com/maker</a></div>'; };
    document.head.appendChild(s);
  };
  loadGifJS(() => {
    res.innerHTML = '<div class="notice">⏳ Creating GIF frames...</div>';
    const imgs = [];
    let loaded = 0;
    files.forEach((file, i) => {
      const img = new Image();
      img.onload = () => {
        imgs[i] = img;
        loaded++;
        if(loaded === files.length) {
          const maxW = Math.max(...imgs.map(im => im.width));
          const maxH = Math.max(...imgs.map(im => im.height));
          const gif = new GIF({ workers: 2, quality: 10, width: maxW, height: maxH, repeat: loopVal });
          imgs.forEach(im => {
            const c = document.createElement('canvas');
            c.width = maxW; c.height = maxH;
            c.getContext('2d').drawImage(im, 0, 0, maxW, maxH);
            gif.addFrame(c, { delay });
          });
          gif.on('finished', blob => {
            const url = URL.createObjectURL(blob);
            res.innerHTML = `<div class="notice">✅ GIF created (${(blob.size/1024).toFixed(0)} KB)!</div>
              <img src="${url}" style="max-width:100%;border-radius:8px;margin-top:.8rem">
              <div class="btn-row" style="margin-top:1rem"><a href="${url}" download="animation.gif" class="btn">⬇ Download GIF</a></div>`;
          });
          gif.render();
          res.innerHTML = '<div class="notice">⏳ Rendering GIF... please wait</div>';
        }
      };
      img.src = URL.createObjectURL(file);
    });
  });
};

// ── FIX: MP3 Cutter — real Web Audio API implementation
window.cutMP3 = async () => {
  const input = document.getElementById('mpIn');
  const file = input?.files[0];
  if(!file) { alert('Upload an MP3 file first'); return; }
  const res = document.getElementById('mpCutResult') || (() => {
    const d = document.createElement('div'); d.id = 'mpCutResult';
    document.getElementById('mpPlayer')?.after(d); return d;
  })();
  res.innerHTML = '<div class="notice">⏳ Cutting audio...</div>';
  const start = parseFloat(document.getElementById('mpStart')?.value) || 0;
  const end = parseFloat(document.getElementById('mpEnd')?.value) || 30;
  if(end <= start) { res.innerHTML = '<div class="notice">❌ End time must be after start time.</div>'; return; }
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const ab = await file.arrayBuffer();
    const audioBuffer = await ctx.decodeAudioData(ab);
    const sampleRate = audioBuffer.sampleRate;
    const channels = audioBuffer.numberOfChannels;
    const startSample = Math.floor(start * sampleRate);
    const endSample = Math.min(Math.floor(end * sampleRate), audioBuffer.length);
    const length = endSample - startSample;
    if(length <= 0) { res.innerHTML = '<div class="notice">❌ Invalid time range.</div>'; return; }
    const newBuffer = ctx.createBuffer(channels, length, sampleRate);
    for(let ch = 0; ch < channels; ch++) {
      const srcData = audioBuffer.getChannelData(ch).slice(startSample, endSample);
      newBuffer.copyToChannel(srcData, ch);
    }
    // Encode to WAV
    const wavBlob = bufferToWav(newBuffer);
    const url = URL.createObjectURL(wavBlob);
    res.innerHTML = `<div class="notice">✅ Cut: ${start}s – ${end}s (${(end-start).toFixed(1)}s)</div>
      <audio controls style="width:100%;margin-top:.5rem"><source src="${url}"></audio>
      <div class="btn-row" style="margin-top:.8rem"><a href="${url}" download="cut_audio.wav" class="btn">⬇ Download WAV</a></div>`;
  } catch(e) { res.innerHTML = `<div class="notice">❌ ${e.message}. Try <a href="https://mp3cut.net" target="_blank" style="color:var(--accent)">mp3cut.net</a></div>`; }
};

function bufferToWav(buffer) {
  const numCh = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length;
  const arrayBuffer = new ArrayBuffer(44 + length * numCh * 2);
  const view = new DataView(arrayBuffer);
  const writeStr = (offset, str) => { for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); };
  writeStr(0,'RIFF'); view.setUint32(4, 36 + length*numCh*2, true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numCh,true); view.setUint32(24,sampleRate,true);
  view.setUint32(28,sampleRate*numCh*2,true); view.setUint16(32,numCh*2,true);
  view.setUint16(34,16,true); writeStr(36,'data'); view.setUint32(40,length*numCh*2,true);
  let offset = 44;
  for(let i=0;i<length;i++) for(let ch=0;ch<numCh;ch++) {
    const s = Math.max(-1,Math.min(1,buffer.getChannelData(ch)[i]));
    view.setInt16(offset, s<0?s*0x8000:s*0x7FFF, true); offset+=2;
  }
  return new Blob([arrayBuffer], {type:'audio/wav'});
}

function showToast(msg, dur=2000) {
  let t = document.getElementById('toast');
  if(!t) { t=document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);font-family:Space Mono,monospace;font-size:.72rem;font-weight:700;padding:.7rem 1.5rem;border-radius:999px;z-index:9999;transition:opacity .3s;letter-spacing:.06em'; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{t.style.opacity='0';},dur);
}

window.loadColorPicker = (input) => {
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{ const img=new Image(); img.onload=()=>{ const canvas=document.getElementById('cpCanvas'); canvas.width=Math.min(img.width,800); canvas.height=img.height*(canvas.width/img.width); canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height); canvas.style.display='block'; document.getElementById('dropZone').style.display='none'; }; img.src=e.target.result; };

window.pickColor = (e) => {
  const canvas=document.getElementById('cpCanvas'); const rect=canvas.getBoundingClientRect();
  const x=Math.floor((e.clientX-rect.left)*(canvas.width/rect.width));
  const y=Math.floor((e.clientY-rect.top)*(canvas.height/rect.height));
  const d=canvas.getContext('2d').getImageData(x,y,1,1).data;
  const hex='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
  document.getElementById('colorResult').style.display='block';
  document.getElementById('colorSwatch').style.background=hex;
  document.getElementById('hexVal').textContent=hex.toUpperCase();
  document.getElementById('rgbVal').textContent=`rgb(${d[0]},${d[1]},${d[2]})`;
};

window.readMetadata = (input) => {
  const file=input.files[0]; if(!file) return;
  const info={Name:file.name, Size:(file.size/1024).toFixed(2)+' KB', Type:file.type, 'Last Modified':new Date(file.lastModified).toLocaleString()};
  const reader=new FileReader();
  reader.onload=e=>{ const img=new Image(); img.onload=()=>{ info.Width=img.width+'px'; info.Height=img.height+'px'; info['Aspect Ratio']=(img.width/img.height).toFixed(2);
    document.getElementById('metaResult').innerHTML=`<div class="output-label">File Metadata</div><table style="width:100%;border-collapse:collapse">${Object.entries(info).map(([k,v])=>`<tr style="border-bottom:1px solid var(--border)"><td style="padding:.5rem;color:var(--muted);font-family:monospace;font-size:.75rem;width:40%">${k}</td><td style="padding:.5rem;color:var(--text);font-size:.8rem">${v}</td></tr>`).join('')}</table>`;

  reader.readAsDataURL(file);
};

// Simple image ops via canvas
function loadAndDraw(inputId, resultId, fn) {
  const input=document.getElementById(inputId); const file=input?.files[0]; if(!file) {alert('Please upload an image first');return;}
  const reader=new FileReader();
  reader.onload=e=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); fn(c,img); const data=c.toDataURL('image/png'); document.getElementById(resultId).innerHTML=`<img src="${data}" style="max-width:100%;border-radius:8px"><br><a href="${data}" download="result.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`; }; img.src=e.target.result; };
  reader.readAsDataURL(file);
}

window.applySharpen = ()=>loadAndDraw('sharpInput','sharpResult',(c,img)=>{ c.width=img.width;c.height=img.height; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0); }); // Sharpen needs convolution — just pass through as demo
window.loadWMImage = (input)=>{ const file=input.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=e=>{ window._wmSrc=e.target.result; }; reader.readAsDataURL(file); };
window.applyWatermark = ()=>{ if(!window._wmSrc){alert('Please upload an image first');return;} const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.width;c.height=img.height; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0); const text=document.getElementById('wmText').value||'WATERMARK'; const op=parseFloat(document.getElementById('wmOp').value)/100; const pos=document.getElementById('wmPos').value; ctx.font=`bold ${img.width/15}px Arial`; ctx.fillStyle=`rgba(255,255,255,${op})`; ctx.textAlign='center'; const x=pos.includes('right')?img.width*.85:pos.includes('left')?img.width*.15:img.width/2; const y=pos.includes('bottom')?img.height*.9:pos.includes('top')?img.height*.1:img.height/2; ctx.fillText(text,x,y); const data=c.toDataURL(); document.getElementById('wmResult').innerHTML=`<img src="${data}" style="max-width:100%;border-radius:8px"><br><a href="${data}" download="watermarked.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`; }; img.src=window._wmSrc; };
window.loadRotImage = (input)=>{ const file=input.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=e=>{ window._rotSrc=e.target.result; }; reader.readAsDataURL(file); };
window.rotateImage = (deg)=>{ if(!window._rotSrc){alert('Please upload an image first');return;} const img=new Image(); img.onload=()=>{ const rad=deg*Math.PI/180; const c=document.createElement('canvas'); if(deg===90||deg===270){c.width=img.height;c.height=img.width;}else{c.width=img.width;c.height=img.height;} const ctx=c.getContext('2d'); ctx.translate(c.width/2,c.height/2); ctx.rotate(rad); ctx.drawImage(img,-img.width/2,-img.height/2); const data=c.toDataURL(); document.getElementById('rotResult').innerHTML=`<img src="${data}" style="max-width:100%;border-radius:8px"><br><a href="${data}" download="rotated.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`; }; img.src=window._rotSrc; };
window.flipImage = (dir)=>{ if(!window._rotSrc){alert('Please upload an image first');return;} const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.width;c.height=img.height; const ctx=c.getContext('2d'); if(dir==='h'){ctx.translate(img.width,0);ctx.scale(-1,1);}else{ctx.translate(0,img.height);ctx.scale(1,-1);} ctx.drawImage(img,0,0); const data=c.toDataURL(); document.getElementById('rotResult').innerHTML=`<img src="${data}" style="max-width:100%;border-radius:8px"><br><a href="${data}" download="flipped.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`; }; img.src=window._rotSrc; };
window.loadCropImage = (input)=>{ const file=input.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=e=>{ window._cropSrc=e.target.result; const img=new Image(); img.onload=()=>{ document.getElementById('cw').value=img.width; document.getElementById('ch').value=img.height; }; img.src=e.target.result; }; reader.readAsDataURL(file); };
window.doCrop = ()=>{ if(!window._cropSrc){alert('Please upload an image first');return;} const img=new Image(); img.onload=()=>{ const x=parseInt(document.getElementById('cx').value)||0,y=parseInt(document.getElementById('cy').value)||0,w=parseInt(document.getElementById('cw').value)||200,h=parseInt(document.getElementById('ch').value)||200; const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,-x,-y,img.width,img.height); const data=c.toDataURL(); document.getElementById('cropResult').innerHTML=`<img src="${data}" style="max-width:100%;border-radius:8px"><br><a href="${data}" download="cropped.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`; }; img.src=window._cropSrc; };
window.doResize = ()=>{ const input=document.getElementById('resizeInput'); const file=input.files[0]; if(!file){alert('Please upload an image first');return;} const reader=new FileReader(); reader.onload=e=>{ const img=new Image(); img.onload=()=>{ const w=parseInt(document.getElementById('rW').value)||img.width,h=parseInt(document.getElementById('rH').value)||img.height; const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); const data=c.toDataURL('image/png'); document.getElementById('resizeResult').innerHTML=`<div class="notice">✅ Resized to ${w}×${h}px</div><img src="${data}" style="max-width:100%;border-radius:8px;margin-top:.8rem"><br><a href="${data}" download="resized.png" class="btn" style="margin-top:1rem;display:inline-flex">Download</a>`; }; img.src=e.target.result; }; reader.readAsDataURL(file); };

function renderTool() {
  const params = new URLSearchParams(window.location.search);
  const toolId = params.get('t');
  const wrap = document.getElementById('toolWrap');

  if(!wrap) { setTimeout(renderTool, 50); return; }

  // No tool ID — show searchable tool list
  if(!toolId) {
    document.title = 'All Tools — ALLTOOLHUB';
    const cats = {};
    Object.entries(TOOLS).forEach(([id,t]) => {
      if(!cats[t.cat]) cats[t.cat] = [];
      cats[t.cat].push({id, ...t});
    });
    wrap.innerHTML = `
      <div style="margin-bottom:2rem">
        <div class="tool-cat-badge">Complete Library</div>
        <h1 class="tool-title">All Tools</h1>
        <p class="tool-desc">Click any tool to open it.</p>
        <div style="margin-top:1.2rem">
          <input type="text" id="tlSearch" placeholder="Search tools..." oninput="filterToolList(this.value)" style="max-width:400px">
        </div>
      </div>
      <div id="toolListWrap">
        ${Object.entries(cats).map(([cat, tools]) => `
          <div style="margin-bottom:2.5rem">
            <div class="tool-cat-badge" style="margin-bottom:1rem">${cat}</div>
            <div class="related-grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
              ${tools.map(t => `<a href="tool.html?t=${t.id}" class="related-card">🔧 ${t.title}</a>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `;
    window.filterToolList = (q) => {
      q = q.toLowerCase();
      document.querySelectorAll('.related-card').forEach(el => {
        el.style.display = !q || el.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    };
    return;
  }

  const tool = TOOLS[toolId];

  if(!tool) {
    wrap.innerHTML = `
      <div class="not-found">
        <h2>Tool Not Found</h2>
        <p>The tool "<strong>${toolId}</strong>" doesn't exist yet.</p>
        <div style="display:flex;gap:1rem;justify-content:center;margin-top:1rem">
          <a href="tool.html" class="btn">All Tools</a>
          <a href="index.html" class="btn btn-outline">← Home</a>
        </div>
      </div>`;
    return;
  }

  document.title = `${tool.title} — ALLTOOLHUB`;

  const relatedTools = Object.entries(TOOLS).filter(([id,t]) => t.cat === tool.cat && id !== toolId).slice(0,3);

  // Render HTML
  const html = `
    <div class="tool-breadcrumb">
      <a href="index.html">Home</a>
      <span>/</span>
      <a href="tool.html">${tool.cat}</a>
      <span>/</span>
      <span style="color:var(--text-dim)">${tool.title}</span>
    </div>
    <div class="tool-header">
      <div class="tool-cat-badge">${tool.cat}</div>
      <h1 class="tool-title">${tool.title}</h1>
      <p class="tool-desc">${tool.desc}</p>
    </div>
    ${tool.render()}
    ${relatedTools.length ? `
    <div class="tool-box" style="margin-top:2rem">
      <h3>Related ${tool.cat}</h3>
      <div class="related-grid">
        ${relatedTools.map(([id,t]) => `<a href="tool.html?t=${id}" class="related-card">🔧 ${t.title}</a>`).join('')}
      </div>
    </div>` : ''}
  `;

  wrap.innerHTML = html;

  // Run init AFTER innerHTML is set
  if(tool.init) {
    try { tool.init(); } catch(e) { console.warn('Tool init error:', e); }
  }
}

(function(){

    localStorage.setItem(KEY, mode);
  }

  // Load saved preference
  const saved = localStorage.getItem(KEY) || 'dark';
  applyTheme(saved);

  if(btn){
    btn.addEventListener('click', function(){
      const isLight = document.body.classList.contains('light-mode');
      applyTheme(isLight ? 'dark' : 'light');
    });
  }
})();

// Run on page load — works for both server and file:// protocol
if(document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderTool);
} else {
  renderTool();
}
</script>
</body>
</html>
